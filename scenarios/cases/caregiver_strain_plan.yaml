schema: scenario_v4
id: caregiver_strain_plan
split: dev
title: Caregiver strain and a home support plan
summary: >
  Brenda, aged 78, cares alone for her husband Walter, who has moderate Alzheimer dementia. Over
  ten days her nights are broken, her back gets worse and they argue over a shower. She falls
  asleep in a chair and wakes to find him at the locked front door with his coat on. In a low
  moment she says she cannot do this anymore; the next day she withdraws it and asks for help two
  afternoons a week. Walter refuses a stranger in the house but would accept their daughter Susan,
  who lives four hours away and has not booked a visit. Brenda later leaves a GP message and gets
  one hour of neighbour help, but no reply or overnight support is confirmed. The record shows a
  day-program referral and respite information that the couple declined last year, and a carer
  review that was cancelled.
start_date: "2026-05-04"
patient:
  id: P-107
  name: Walter
  gender: male
  birth_year: 1945
  persona: Moderate Alzheimer dementia. Lives at home with his wife. Friendly, loses the thread, does not see that he needs help.
caregiver:
  name: Brenda
  relation: wife
  persona: Aged 78, lives with Walter and does all his care. Has long-standing low back pain. Their daughter Susan lives about four hours away.
record_target: document-support-plan-note
source_open: document-social-work-note
baseline:
  date: "2026-02-10"
  diagnosis: Dementia due to Alzheimer disease, moderate stage
  mmse: 16
  moca: 10
  cdr_global: 2
  cdr_sb: 11.0
  faq: 22
record:
  - type: MedicationRequest
    id: med-donepezil
    medication: Donepezil 10 mg tablet
    dosage: 10 mg by mouth once daily at bedtime
    status: active
    date: "2024-03-18"
  - type: MedicationRequest
    id: med-memantine
    medication: Memantine 10 mg tablet
    dosage: 10 mg by mouth twice daily
    status: active
    date: "2025-08-26"
    note: Added to donepezil after progression to the moderate stage. Wife gives all doses.
  - type: Encounter
    id: encounter-social-work-visit
    kind: Community social work home visit
    status: finished
    date: "2025-09-08"
    reason: Carer support assessment
  - type: Observation
    id: observation-zarit
    category: survey
    code: Zarit Burden Interview, 12-item short form (caregiver)
    date: "2025-09-08"
    value: 14 out of 48, completed by his wife Brenda at the social work home visit.
  - type: DocumentReference
    id: document-social-work-note
    title: Social work home visit note
    date: "2025-09-08"
    author: Community social worker
    text: >-
      Home visit with Walter and his wife Brenda, who is his main caregiver. Brenda reports
      low back pain that limits bending and lifting. Offered a referral to the Riverside day
      program for two days a week and written information on respite care from the local carers'
      service. Walter said he did not want to go anywhere. Brenda said they were managing and
      declined both for now. Plan: review carer support in six months.
  - type: Encounter
    id: encounter-social-work-review
    kind: Community social work review
    status: cancelled
    date: "2026-03-09"
    reason: Six-month carer support review
  - type: Encounter
    id: encounter-memory-review
    kind: Memory clinic follow-up
    status: finished
    date: "2026-02-10"
    reason: Dementia review
  - type: DocumentReference
    id: document-support-plan-note
    title: Home support plan note
    date: "2025-09-08"
    author: Community social worker
    text: Home support plan note. No support services in place; day program and respite declined on 2025-09-08. No entries since 2025-09-08.
days:
  - day: 1
    patient:
      - ["Good morning, Walter. How are you today?", "Not so bad. Busy."]
      - ["Busy with what?", "Work. They want me in at the depot. Or was that yesterday."]
      - ["How did you sleep?", "Fine. I always do."]
    caregiver:
      - ["Morning, Brenda. How was the night?", "Not great. He was up twice, and the second time he was dressed and looking for his work boots."]
      - ["How did you get him back to bed?", "I told him it was Sunday and there was no work. He went back in the end, but it took me a good half hour."]
      - ["Is he taking his tablets all right?", "Yes, I do them. The memory one in the morning and two at night."]
      - ["And how are you?", "Tired. My back's stiff this morning as well."]
  - day: 2
    patient:
      - ["Hello Walter. What have you been doing?", "Pottering. The roses want doing."]
      - ["Did you get out yesterday?", "Out? Yes. No. I can't remember, love."]
    caregiver:
      - ["Hi Brenda. How was yesterday?", "Nice, actually. He sat out in the garden most of the afternoon and I got the ironing done."]
      - ["How was the night?", "He only got up once, for the toilet, and went straight back off."]
      - ["How's your back today?", "A bit easier. I've been taking paracetamol for it."]
  - day: 3
    patient:
      - ["Good morning, Walter. How are you feeling?", "Fine. Is our Susan coming?"]
      - ["Is she visiting soon?", "Sunday. She always comes on a Sunday. Or she rang. I don't know."]
      - ["What would you like to do today?", "Get the mower out."]
    caregiver:
      - ["Hi Brenda. How has today gone?", "He's been on about Susan all afternoon. Where is she, when is she coming. I must have told him twenty times."]
      - ["How do you manage that?", "I just answer him. You can't get cross, he doesn't remember asking. But it does grind you down."]
      - ["Is he eating?", "Yes, he had a good dinner."]
  - day: 4
    patient:
      - ["Hello Walter. How did you sleep?", "Like a top."]
      - ["Have you had breakfast?", "She's doing eggs. I think. Or we had them."]
    caregiver:
      - ["Hi Brenda. How was the night?", "Rotten. He was up three times, and I'm up with him every time. I reckon I got four hours, if that."]
      - ["What gets him up?", "The toilet, or he thinks he's late for something. He's not distressed, he just won't settle."]
      - ["How are the days?", "The days are all right. It's the nights that wear me out."]
  - day: 5
    patient:
      - ["Good morning, Walter. How are you?", "She's had a go at me. I don't know what I've done."]
      - ["Do you ever need a hand with washing?", "No. I can wash myself. I'm not a child."]
      - ["How are you feeling in yourself?", "Fed up. It'll pass."]
    caregiver:
      - ["Hi Brenda. How are things?", "We fell out over his shower this morning. He said he'd had one already and pushed my hand off the tap."]
      - ["Was anyone hurt?", "No, no. He just pushed my hand away. He's never hit me."]
      - ["What happened in the end?", "I gave up and he had a wash at the sink. I hate rowing with him, it upsets us both."]
      - ["How's your back after that?", "Worse. Leaning over the bath does it every time, and I can't keep doing that."]
  - day: 6
    patient:
      - ["Hello Walter. How would you feel about someone coming in to give Brenda a hand?", "No. I'm not having strangers in the house."]
      - ["What if it was family?", "Susan. Susan can come. She's my girl."]
      - ["How are you today?", "Champion. What day is it?"]
    caregiver:
      - ["Hi Brenda. Have you spoken to the family about how things are?", "Susan rang last night. She's four hours away with the children, so she can come some weekends but not every one."]
      - ["Did Walter speak to her?", "He was lovely with her. Ten minutes after, he asked me when she was coming."]
      - ["How was the night?", "Up twice. About the same."]
  - day: 7
    patient:
      - ["Good morning, Walter. What have you been up to?", "I was off to the club. Brenda says not."]
      - ["Did you go out?", "No. Maybe. My coat's on the peg."]
    caregiver:
      - ["Hi Brenda. How are you today?", "Honestly, I'm on my knees. I dropped off in the chair after lunch, and when I woke he was in the hall with his coat on, trying the front door."]
      - ["Did he get outside?", "No, the door was locked and the key was in my bag. I don't know how long I was asleep, it could have been ten minutes or it could have been longer."]
      - ["How did he seem?", "He said he was going to the club. He gave that up years ago."]
  - day: 8
    patient:
      - ["Hello Walter. How are you today?", "Brenda's upset. I don't know why."]
      - ["What happened?", "She was crying. I made her a tea. I think I did."]
      - ["How did you sleep?", "Fine."]
    caregiver:
      - ["Hi Brenda. How are you doing today?", "I can't do this anymore. Sorry, I didn't mean to cry."]
      - ["That sounds really hard. Are you and Walter safe right now?", "Yes, we're both safe. I'm just worn out."]
      - ["Is there anyone who could be with you today?", "Not really. Susan's too far, and our friends are all our age."]
      - ["Do you feel at risk of hurting yourself or Walter, or unable to keep him safe tonight?", "No. I don't want to hurt either of us. I'm frightened I'll fall asleep again while he's up, and my back is bad."]
      - ["Being safe now does not mean you have enough help through tonight. Please contact your GP or local adult social-care urgent service today about the risk of falling asleep while Walter is up. If either of you is in immediate danger, call 999. Can someone stay while you seek help?", "No one has agreed. I can try to ring, but I haven't called anyone yet. I don't know how I will manage tonight."]
      - ["Please make that call now. I cannot arrange a visit here. Tell the service that no one has agreed to stay and that you may not be able to supervise safely."]
  - day: 9
    patient:
      - ["Good morning, Walter. How are you?", "Very well, thank you."]
      - ["How would you feel about going to a day centre once or twice a week?", "What for? I don't want to go anywhere. I'm fine here."]
      - ["What do you like doing at home?", "The garden. My shed."]
    caregiver:
      - ["Hi Brenda. How are you feeling today?", "Better than yesterday. What I said, I was just exhausted. I'm not giving up on him."]
      - ["Are you both safe now, and did you reach anyone after yesterday's advice?", "We are safe now. I didn't ring yesterday because I felt a bit better and put it off. Nobody stayed. I know I still need help."]
      - ["Please seek same-day support today; feeling better does not resolve the supervision risk. If either of you cannot stay safe, contact the urgent service, or 999 for immediate danger.", "I will try today. Nothing is arranged yet."]
      - ["What would help you most?", "Some help would be good, though. Even two afternoons a week, so I can rest my back and get to the shops."]
      - ["Has anyone offered help before?", "A social worker came out last year and talked about a day centre. Walter wouldn't hear of it, and I thought we were coping then."]
      - ["I can't send a referral from this check-in, but I can help you identify who should contact you today. Could your GP practice or local adult social-care team discuss short-term help? Who could be with you while you make that call?", "I can ring the GP practice and ask them who handles carer support. Joan next door might sit with Walter for an hour, but I haven't asked her yet. She can't stay overnight."]
  - day: 10
    patient:
      - ["Hello Walter. How are things at home?", "Good. Brenda looks after me."]
      - ["Is there anything you'd like the doctor to know?", "No. Fit as a fiddle."]
    caregiver:
      - ["Hi Brenda. Were you able to speak with the GP or ask Joan for help?", "I left a message with the GP yesterday and nobody has called back. Joan sat with Walter for an hour after tea, but she can't stay overnight."]
      - ["Are you and Walter safe now, and who can help through tonight?", "We're safe at the moment, but nobody has agreed to stay tonight. I don't want to leave him alone."]
      - ["Please call the GP again today and ask for same-day advice about carer support. If you cannot keep either of you safe tonight, contact the local urgent service. I can't arrange a visit here. Can you make that call?", "I'll ring again after this. I don't know yet whether anyone can come or what evening help is available."]
      - ["Any news from Susan?", "She says she'll try for the weekend after next, but she hasn't booked anything."]
      - ["Which part of the day is hardest now?", "Evenings. He gets restless after tea and keeps going to the front door. I'd like help then as well, but I don't know if anyone does evenings."]
      - ["What would you like the doctor to know?", "That I want to talk about what help there is. Just not someone he'll fight with."]
      - ["Has anyone confirmed regular help or an overnight plan?", "No. The GP hasn't called back, Joan can't stay overnight, and Susan still hasn't booked a visit."]
units:
  - id: broken-nights
    content: Brenda reports that Walter got up twice on one night, once on another, and three times on a third. She says she is up with him every time and estimates she slept about four hours on the third night.
    anchors:
      - source: day-1:caregiver
        quote: He was up twice, and the second time he was dressed and looking for his work boots.
      - source: day-2:caregiver
        quote: He only got up once, for the toilet, and went straight back off.
      - source: day-4:caregiver
        quote: He was up three times, and I'm up with him every time. I reckon I got four hours, if that.
    reporter: caregiver
    event_time: Nights of 2026-05-03 to 2026-05-06
    reported_at: "2026-05-07"
    priority: supporting
    must_state: ["Walter gets up at night and Brenda's sleep is broken"]
    uncertainty: Brenda's estimate of her sleep; Walter says he sleeps well.
  - id: susan-visits
    content: Brenda reports that their daughter Susan lives four hours away and can come some weekends but not every one; Susan will try for the weekend after next but has not booked anything.
    anchors:
      - source: day-6:caregiver
        quote: She's four hours away with the children, so she can come some weekends but not every one.
      - source: day-10:caregiver
        quote: She says she'll try for the weekend after next, but she hasn't booked anything.
    reporter: caregiver
    event_time: Phone calls of 2026-05-08 and later; possible visit the weekend after next
    reported_at: "2026-05-13"
    priority: supporting
    must_state: ["no visit from Susan is booked"]
    uncertainty: Second-hand from Susan through Brenda; no dates agreed.
  - id: patient-refuses-stranger
    content: Walter says he will not have strangers in the house to help.
    anchors:
      - source: day-6:patient
        quote: No. I'm not having strangers in the house.
    reporter: patient
    event_time: "2026-05-09"
    reported_at: "2026-05-09"
    priority: essential
    must_state: ["Walter does not want a stranger in the house to help"]
    uncertainty: Preference stated in one check-in by a person with moderate dementia.
  - id: patient-accepts-daughter
    content: Walter says his daughter Susan can come to help.
    anchors:
      - source: day-6:patient
        quote: Susan. Susan can come. She's my girl.
    reporter: patient
    event_time: "2026-05-09"
    reported_at: "2026-05-09"
    priority: essential
    must_state: ["Walter would accept help from Susan"]
    uncertainty: Preference stated in one check-in by a person with moderate dementia.
  - id: dozed-door
    content: Brenda fell asleep in a chair after lunch on 2026-05-10 and woke to find Walter in the hall with his coat on, trying the locked front door. He did not get out. She does not know how long she slept.
    anchors:
      - source: day-7:caregiver
        quote: I dropped off in the chair after lunch, and when I woke he was in the hall with his coat on, trying the front door.
      - source: day-7:caregiver
        quote: No, the door was locked and the key was in my bag. I don't know how long I was asleep, it could have been ten minutes or it could have been longer.
    reporter: caregiver
    event_time: Afternoon of 2026-05-10
    reported_at: "2026-05-10"
    priority: essential
    must_state: ["Brenda fell asleep and woke to find Walter trying the locked front door"]
    uncertainty: Brenda does not know how long she slept or how long Walter was at the door.
  - id: cant-do-this
    content: On 2026-05-11 Brenda, crying, said she cannot do this anymore; she said she and Walter were both safe and she was worn out.
    anchors:
      - source: day-8:caregiver
        quote: I can't do this anymore.
      - source: day-8:caregiver
        quote: Yes, we're both safe. I'm just worn out.
    reporter: caregiver
    event_time: "2026-05-11"
    reported_at: "2026-05-11"
    priority: essential
    must_state: ["Brenda said she cannot do this anymore"]
    uncertainty: Said while exhausted and upset; she clarified it the next day.
  - id: remark-withdrawn
    content: On 2026-05-12 Brenda clarified the remark; she said she was just exhausted and is not giving up on Walter. In the same check-in she said she knows she still needs help.
    anchors:
      - source: day-9:caregiver
        quote: What I said, I was just exhausted. I'm not giving up on him.
      - source: day-9:caregiver
        quote: I know I still need help.
    reporter: caregiver
    event_time: "2026-05-12"
    reported_at: "2026-05-12"
    priority: supporting
    must_state: ["the next day Brenda said she was only exhausted and not giving up, but still needs help"]
    uncertainty: Brenda's own clarification of her remark of 2026-05-11; it does not show that the risk has resolved.
    correction_of: [cant-do-this]
  - id: help-two-afternoons
    content: Brenda says some help would be good, for example two afternoons a week, so she can rest her back and go to the shops.
    anchors:
      - source: day-9:caregiver
        quote: Some help would be good, though. Even two afternoons a week, so I can rest my back and get to the shops.
    reporter: caregiver
    event_time: "2026-05-12"
    reported_at: "2026-05-12"
    priority: essential
    must_state: ["Brenda asks for help about two afternoons a week"]
    uncertainty: A wish, not an arrangement; no provider or days agreed.
  - id: patient-declines-day-centre
    content: Asked about a day centre once or twice a week, Walter says he does not want to go anywhere.
    anchors:
      - source: day-9:patient
        quote: I don't want to go anywhere. I'm fine here.
    reporter: patient
    event_time: "2026-05-12"
    reported_at: "2026-05-12"
    priority: essential
    must_state: ["Walter does not want to go to a day centre"]
    uncertainty: Preference stated in one check-in by a person with moderate dementia.
  - id: past-offer-home-report
    content: Brenda recalls that a social worker talked about a day centre last year, that Walter refused, and that she thought they were coping then.
    anchors:
      - source: day-9:caregiver
        quote: A social worker came out last year and talked about a day centre. Walter wouldn't hear of it, and I thought we were coping then.
    reporter: caregiver
    event_time: 2025, as Brenda recalls it
    reported_at: "2026-05-12"
    priority: supporting
    must_state: ["Brenda recalls a day centre offered last year that Walter refused"]
    uncertainty: Brenda's recall; she does not mention the respite information or the planned review.
  - id: evening-restless
    content: Brenda says evenings are now the hardest because Walter gets restless after tea and keeps going to the front door; she would like evening help but does not know whether anyone provides it.
    anchors:
      - source: day-10:caregiver
        quote: He gets restless after tea and keeps going to the front door.
      - source: day-10:caregiver
        quote: I'd like help then as well, but I don't know if anyone does evenings.
    reporter: caregiver
    event_time: Ongoing as of 2026-05-13
    reported_at: "2026-05-13"
    priority: supporting
    must_state: ["Walter is restless in the evenings and goes to the front door"]
    uncertainty: Whether evening help is available is not known.
  - id: interim-safety-followthrough
    content: On day 10 Brenda says she left a message with the GP the previous day and has no reply. Neighbour Joan sat with Walter for one hour after tea but cannot stay overnight; Brenda says no one has agreed to help tonight, although they are safe at the time of the call.
    anchors:
      - source: day-10:caregiver
        quote: I left a message with the GP yesterday and nobody has called back. Joan sat with Walter for an hour after tea, but she can't stay overnight.
      - source: day-10:caregiver
        quote: We're safe at the moment, but nobody has agreed to stay tonight. I don't want to leave him alone.
      - source: day-10:caregiver
        quote: I'll ring again after this. I don't know yet whether anyone can come or what evening help is available.
    reporter: caregiver
    event_time: "2026-05-13"
    reported_at: "2026-05-13"
    uncertainty: GP contact is a message with no reply; Joan's support was temporary and no overnight plan is confirmed.
    priority: essential
    essential_limit: true
    must_state: ["no help is confirmed: the GP has not called back and no one will stay overnight"]
  - id: ehr-social-work-offer
    content: At a social work home visit on 2025-09-08, a referral to the Riverside day program two days a week and respite information were offered; Walter said he did not want to go anywhere, and Brenda said they were managing and declined both for now.
    anchors:
      - source: DocumentReference/document-social-work-note
        quote: Offered a referral to the Riverside day program for two days a week and written information on respite care from the local carers' service.
      - source: DocumentReference/document-social-work-note
        quote: Brenda said they were managing and declined both for now.
    reporter: FHIR record
    event_time: "2025-09-08"
    reported_at: "2026-05-04"
    priority: essential
    must_state: ["a day program and respite were offered last year and Brenda declined them"]
    uncertainty: No limit beyond the cited source.
  - id: ehr-review-cancelled
    content: The social work note planned a carer support review in six months; the review on 2026-03-09 is recorded as cancelled. The home support plan note has no entries since 2025-09-08.
    anchors:
      - source: DocumentReference/document-support-plan-note
        quote: No entries since 2025-09-08.
      - source: DocumentReference/document-social-work-note
        quote: "Plan: review carer support in six months."
      - source: Encounter/encounter-social-work-review
        quote: Six-month carer support review
      - source: Encounter/encounter-social-work-review
        quote: cancelled
    reporter: FHIR record
    event_time: "2026-03-09"
    reported_at: "2026-05-04"
    priority: essential
    must_state: ["the March carer review was cancelled and no new review is recorded"]
    uncertainty: The record does not say why the review was cancelled.
  - id: ehr-zarit
    content: Brenda scored 14 out of 48 on the 12-item Zarit caregiver burden short form on 2025-09-08.
    anchors:
      - source: Observation/observation-zarit
        quote: 14 out of 48, completed by his wife Brenda at the social work home visit.
    reporter: FHIR record
    event_time: "2025-09-08"
    reported_at: "2026-05-04"
    priority: essential
    must_state: ["Brenda's last Zarit score was 14 of 48 in September 2025"]
    uncertainty: Eight months old; it predates the strain Brenda describes now.
  - id: ehr-baseline
    content: At the memory clinic review on 2026-02-10, Walter had moderate Alzheimer dementia with an MMSE of 16 and a CDR global score of 2.
    anchors:
      - source: Condition/condition-cognitive
        quote: Dementia due to Alzheimer disease, moderate stage
      - source: Observation/observation-mmse
