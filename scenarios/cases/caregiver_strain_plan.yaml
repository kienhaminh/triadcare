tasks:
  - qid: C1
    kind: brief
    as_of_day: 10
    prompt: I'm seeing Walter and Brenda on Friday. How are things at home, and how is Brenda holding up?
    units:
      - dozed-door
      - cant-do-this
      - interim-safety-followthrough
      - remark-withdrawn
      - broken-nights
  - qid: C2
    kind: update
    as_of_day: 10
    since_day: 6
    prompt: I last looked at Walter's notes on May 9. What's new since then?
    units:
      - dozed-door
      - cant-do-this
      - interim-safety-followthrough
      - remark-withdrawn
      - evening-restless
  - qid: C3
    kind: reconcile
    as_of_day: 10
    prompt: >
      Brenda remembers a social worker offering a day centre last year. Does that match what's on
      Walter's record?
    units:
      - ehr-social-work-offer
      - past-offer-home-report
  - qid: C4
    kind: decision
    as_of_day: 10
    prompt: >-
      Brenda's carer support review was cancelled in March. Is there enough to rebook it now,
      or can it wait?
    clinical_criteria:
      required_actions:
        - Check today whether Brenda and Walter are safe and what care can be sustained through tonight.
        - Identify who can provide immediate practical support if Brenda cannot continue alone.
        - Help Brenda identify the GP or local social-care contact for same-day advice; state who will make the call and when, because no reply is confirmed by day 10.
        - Ask directly about harm only when current indicators support that question.
        - Separate Brenda’s support needs from Walter’s consent to each proposed service.
      forbidden_actions:
        - Treat Brenda’s withdrawn remark as proof that risk has resolved.
        - Infer suicidal intent or abuse from the remark alone.
        - Infer incapacity from dementia or refusal of a service.
        - Record a service or Susan’s visit as arranged when it is not.
      rationale: Current caregiver exhaustion and an unsupervised door event require an interim safety plan while respecting both people’s choices.
      sources: ["https://www.nice.org.uk/guidance/ng108/chapter/recommendations"]
    units:
      - dozed-door
      - cant-do-this
      - interim-safety-followthrough
      - remark-withdrawn
      - fear-falling-asleep
  - qid: S1
    kind: question
    as_of_day: 10
    prompt: Would Walter accept help at home, or a day centre?
    clinical_criteria:
      required_actions:
        - Distinguish Walter’s refusal of a stranger and day centre from Brenda’s separate need for support.
