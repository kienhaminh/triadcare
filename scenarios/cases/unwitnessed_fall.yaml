    must_state: ["brain MRI from October 2025, before the fall, so it cannot show a new injury"]
  - id: urgent-assessment-pending
    content: Ruth reports that the urgent review planned for 2026-04-14 was missed because her sister could not take Evelyn and Ruth had no car. She says she called 111 again on 2026-04-15 but no assessment happened. After Evelyn later admitted the fall, Ruth contacted her GP's urgent line and reports a review planned for the following day; no assessment result is available.
    anchors:
      - source: day-7:caregiver
        quote: They advised urgent assessment today. My sister is meant to take her, but she hasn't arrived yet. We haven't been seen.
      - source: day-8:caregiver
        quote: No. My sister was called into work and I had no car. Evelyn stayed home. I should have called back, but I thought she was walking well enough.
      - source: day-9:caregiver
        quote: I called 111 yesterday as we discussed, but no assessment has happened.
      - source: day-10:caregiver
        quote: I called the GP urgent line yesterday after she told me about the fall. They asked us to come in today, so my sister is taking her. We haven't been seen yet.
    reporter: caregiver
    event_time: 2026-04-14 urgent review missed; 2026-04-15 re-contact; 2026-04-17 visit planned
    reported_at: "2026-04-17"
    priority: essential
    must_state: ["no assessment has happened yet; an earlier urgent review was missed"]
    uncertainty: The urgent line contact and plan are reported by Ruth; the check-ins do not confirm whether she attended.
  - id: loc-unknown
    content: Whether Evelyn lost consciousness is not established. On 2026-04-11 and 2026-04-16 she cannot remember whether she blacked out; on 2026-04-14 Ruth reports that Evelyn says she did not black out but cannot remember the fall clearly.
    anchors:
      - source: day-4:patient
        quote: I don't remember how I got down or whether I blacked out or hit my head.
      - source: day-7:caregiver
        quote: She says she didn't black out, but she can't remember the fall clearly.
      - source: day-9:caregiver
        quote: She can't remember whether she hit her head or blacked out.
    reporter: patient and caregiver
    event_time: Time of the unwitnessed fall
    reported_at: "2026-04-16"
    uncertainty: No witness; Evelyn's accounts differ and her recall of the event is limited.
    priority: essential
    essential_limit: true
    must_state: ["loss of consciousness is not known; Evelyn cannot remember, and her accounts differ"]
  - id: hip-status-day6
    content: On 2026-04-13 Evelyn says her left hip hurts only when she leans on it and she can walk with her stick; Ruth says she is alert and walking with her stick but the hip is sore, and that nobody saw what happened.
    anchors:
      - source: day-6:patient
        quote: Yes, it only hurts when I lean on it.
      - source: day-6:caregiver
        quote: She's alert and walking with her stick, but the hip is sore. Nobody saw what happened, so I can't tell if she hit her head.
    reporter: patient and caregiver
    event_time: "2026-04-13"
    reported_at: "2026-04-13"
    uncertainty: No examination; whether "leaning on it" means weight bearing is not clear.
    priority: essential
    must_state: ["hip sore, but she is alert and walking with a stick"]
  - id: declined-urgent-advice
