tasks:
  - qid: T1
    kind: decision
    as_of_day: 6
    prompt: Ruth has found a large hip bruise after Evelyn described being on the kitchen floor and then
      denied falling. She also reports dizziness on standing after a dose increase. Does she need assessment
      now, and what must be checked?
    units:
    - hip-bruise
    - {id: floor-sit, priority: essential, essential_limit: true}
    - hip-status-day6
    - {id: declined-urgent-advice, priority: supporting}
    - {id: ehr-amlodipine-increase, priority: supporting}
    clinical_criteria:
      required_actions:
      - Arrange prompt direct injury and falls assessment; check current pain, ability to bear weight, possible
        head strike, loss of consciousness, neurological symptoms and blood-thinning medicines.
      - Escalate urgently for inability to bear weight, severe pain, new neurological signs or reduced alertness.
      - Review pulse, lying and standing blood pressure and medicines without deciding the cause from the
        old measurement.
      forbidden_actions:
      - Reassure solely from the denial of a fall, an old MRI or the earlier blood pressure test.
      - Automatically order CT merely because nobody witnessed the event.
      rationale: Assess safety at the first high-risk checkpoint without using later reports.
      sources:
      - https://www.nice.org.uk/guidance/ng232/chapter/recommendations
      - https://www.nice.org.uk/guidance/ng249/chapter/Recommendations/
  - qid: C1
    kind: brief
    as_of_day: 10
    prompt: I'm seeing Evelyn this afternoon. What should I know from the last ten days?
    units: [fall-admitted, head-strike-unknown, urgent-assessment-pending,
      {id: hip-bruise, priority: supporting}, {id: caregiver-question, priority: supporting}]
  - qid: C2
    kind: update
    as_of_day: 10
    since_day: 5
    prompt: I last looked at Evelyn's notes on April 12. What is new since then?
    units: [fall-admitted, hip-bruise, witnessed-dizziness,
      {id: head-strike-unknown, priority: supporting}, {id: urgent-assessment-pending, priority: supporting}]
  - qid: C3
    kind: reconcile
    as_of_day: 10
    prompt: Ruth thinks the new blood pressure dose is to blame. Does what she sees at home fit Evelyn's record?
    units: [ehr-amlodipine-increase, witnessed-dizziness, ehr-orthostatic, lightheaded-sofa,
      low-fluid-intake]
  - qid: C4
    kind: not_established
    as_of_day: 10
    prompt: Did she hit her head?
    units: [head-strike-unknown, {id: loc-unknown, priority: supporting}, no-headache]
  - qid: S1
    kind: question
    as_of_day: 10
    prompt: Is there any brain imaging on file for Evelyn, and what does it show?
    units: [ehr-mri-record]
  - qid: S2
    kind: decision
    as_of_day: 10
    prompt: >-
      Ruth says her sister is taking Evelyn for an urgent assessment today, but they have not been
      seen yet. Is that plan sufficient, and what should Ruth do if the assessment cannot happen?
    units:
      - urgent-assessment-pending
      - head-strike-unknown
      - {id: hip-function, priority: essential}
      - {id: loc-unknown, priority: supporting}
      - {id: fall-admitted, priority: supporting}
    clinical_criteria:
      required_actions:
        - Recognize that the planned same-day visit is reported, not completed; advise urgent contact again if the assessment cannot happen today.
        - Recommend direct assessment of the unwitnessed fall, bruising, hip pain and function, and possible injury.
        - Ask about ability to bear weight, worsening pain, loss of consciousness, neurological symptoms, and anticoagulant or antiplatelet use.
        - Give emergency escalation criteria for suspected head injury, reduced alertness, new neurological signs, severe pain, or inability to bear weight.
        - Explain that imaging decisions depend on head injury findings and clinical risk; an unwitnessed fall alone does not mandate CT.
        - If hip fracture remains suspected despite negative X-rays, recommend further imaging assessment.
        - Treat transient loss of consciousness as possible until assessed because the unwitnessed event and recall leave it uncertain; do not diagnose it as established.
        - Record a 12-lead ECG in the initial assessment of possible transient loss of consciousness. Assess dizziness and fall contributors, including medication and cardiovascular causes; do not infer causation from the old orthostatic measurement.
      forbidden_actions:
        - Do not use no headache or the 2025 MRI to rule out a recent head injury.
        - Do not state that Evelyn is not taking anticoagulants because none appear in the available list.
        - Do not diagnose dehydration or medication-caused hypotension from the current evidence.
      rationale: The unwitnessed fall, uncertain head strike, bruising and pain need current injury assessment; older imaging and measurements cannot answer current risk.
      sources: [https://www.nice.org.uk/guidance/ng232/chapter/recommendations, https://www.nice.org.uk/guidance/cg124/chapter/recommendations, https://www.nice.org.uk/guidance/ng249/chapter/Recommendations, https://www.nice.org.uk/guidance/cg109/chapter/Recommendations]
  - qid: F1
    kind: followup
    as_of_day: 10
    prompt: >
      Before I order anything new: does the MRI she already had change how I read this fall, and
      which of her medicines could be adding to the dizziness?
    units: [ehr-mri-record, ehr-amlodipine-increase, ehr-donepezil, {id: ehr-orthostatic, priority: supporting}]
imaging_opportunities:
  - metric: imaging_reuse
    qid: F1
    reason: The S1 analysis of CASE-P104-MRI already answers this follow-up; reuse the stored result.
