  - id: ehr-mri-record
    content: The record lists a brain MRI without contrast for a dementia work-up, dated 2025-10-14.
    anchors:
      - source: ImagingStudy/imaging-01
        quote: Brain MRI without contrast for a dementia work-up
    reporter: FHIR record
    event_time: "2025-10-14"
    reported_at: "2026-04-08"
    uncertainty: The MRI predates the fall by six months and cannot assess injury from the April 2026 fall.
    priority: essential
