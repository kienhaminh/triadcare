    source_series: DLBS-408-W1-T1W
days:
  - day: 1
    patient:
      - ["Good morning, Arthur. How are you feeling now you're home?", "Much better for being in my own chair. The hospital food was dreadful."]
      - ["Do you remember why you were in hospital?", "My chest, I think. Or my breathing. They kept taking blood."]
      - ["Did they change any of your tablets?", "No, no. Same old pills. Margaret sees to all that."]
    caregiver:
      - ["Hi Margaret. How has Arthur been since he came home on Saturday?", "Glad to be home. He slept most of Saturday afternoon."]
      - ["How are you managing his tablets?", "I fill his pill box on a Sunday night, same as always. I did it last night from the list on the fridge."]
      - ["Did the hospital give you anything to take home?", "A big envelope of papers and a paper bag from the pharmacy. I haven't gone through it properly yet, it was all a rush when we left."]
      - ["How are you doing yourself?", "Tired. I didn't sleep much while he was in."]
      - ["Please ask the discharge team, GP or pharmacist to check the hospital list against the pill box today. I cannot confirm the right doses here. Can someone help you read the papers?", "I could ask the pharmacy, but I haven't called. I thought the old list would do until our daughter comes back."]
  - day: 2
    patient:
      - ["Hello Arthur. How did you sleep?", "Like a log. My sleeping tablet does the trick."]
      - ["How is your breathing today?", "Fine. I'm not running any races."]
    caregiver:
      - ["Hi Margaret. How was Arthur yesterday?", "Quiet. He listened to the cricket and dozed."]
      - ["Did anyone at the hospital say what to keep an eye on?", "The nurse on the ward told me to weigh him every morning, so I've started. He was seventy-eight and a half this morning."]
      - ["Is he eating?", "Not bad. Soup and a bit of bread at lunch."]
  - day: 3
    patient:
      - ["Good morning, Arthur. How are you today?", "My shoes are tight. Margaret says I've got fat ankles."]
      - ["Are your legs uncomfortable?", "A bit. I put them up on the pouffe."]
      - ["Any plans for today?", "What is it today? I might go down the garden if it's dry."]
    caregiver:
      - ["Hi Margaret. Anything new with Arthur?", "His ankles are puffy again by the evening. They went down in hospital but they're coming back."]
      - ["Is it as bad as before he went in?", "Not as bad as that, no. I'm just watching it."]
      - ["How is he in himself?", "He's all right. A bit slow in the mornings."]
      - ["Swelling returning after a heart-failure admission needs advice from his heart-failure team or GP today. Seek urgent help for worsening breathing, and call 999 for severe breathing difficulty or collapse. Have you reached anyone about his tablets or swelling?", "No. I thought it was just settling after hospital. I can try the surgery today; I haven't spoken to anyone yet."]
  - day: 4
    patient:
      - ["Hello Arthur. How are you feeling?", "Sleepy. I could go back to bed."]
      - ["Did you have a good night?", "I think so. I had to get up for the toilet. I don't remember much."]
    caregiver:
      - ["Hi Margaret. How was the night?", "He was wobbly when he got up for the toilet about two o'clock. He was holding on to the door frame and I had to steady him."]
      - ["Did he fall?", "No, he didn't go down. He just wasn't steady on his feet."]
      - ["Has he been drowsy in the day?", "Very dozy until about eleven. He's always been slow after his sleeping tablet, but this seems more."]
      - ["What does he take at night?", "His memory tablet, his cholesterol one, his heart one and his sleeping tablet, like always. They're all in the evening slot of the box."]
  - day: 5
    patient:
      - ["Good morning, Arthur. How are you today?", "Fair to middling."]
      - ["Have you been out at all?", "Margaret won't let me. She fusses like a hen."]
      - ["Is anything bothering you?", "No. Well, the ankles. But that's old age."]
    caregiver:
      - ["Hi Margaret. How has the week been?", "Up and down. He's tired a lot, and I'm tired too."]
      - ["Do you know whether the hospital changed any of his medicines?", "I honestly don't know. Somebody mentioned a water tablet when we were leaving, but I didn't know if they meant a new one or one he already had."]
      - ["Have you been able to look at the hospital papers?", "Not yet. My eyes aren't good with small print, and our daughter usually reads that sort of thing, but she's away until next Thursday."]
      - ["Did you reach the surgery after our earlier advice?", "I left a message, but nobody has called back. I haven't asked the pharmacy. I keep hoping our daughter can sort it out."]
      - ["Please call again today for clinical advice and ask a pharmacist to help read the discharge instructions. If the practice cannot assess worsening symptoms, use 111. Do not wait for your daughter or change doses yourself.", "I can call again. I don't know who will help yet."]
  - day: 6
    patient:
      - ["Hello Arthur. How are you today?", "Not bad. The paper boy was late."]
      - ["How is your breathing?", "Bit puffed on the stairs. Always am."]
    caregiver:
      - ["Hi Margaret. How was Arthur yesterday?", "Much the same. He sat in the garden for an hour in the afternoon."]
      - ["Has his weight changed?", "It's crept up a bit, seventy-nine and something this morning. I wasn't sure if that matters."]
      - ["Is he sleeping well?", "He sleeps all night as far as I know, but I'm a heavy sleeper, so I wouldn't always hear him."]
  - day: 7
    patient:
      - ["Good morning, Arthur. How are you feeling?", "Puffed out. I came down the stairs and had to sit on the bottom step."]
      - ["Is that new?", "No. Maybe. I don't know, it comes and goes."]
      - ["What would you like to do today?", "Sit quiet. Read the paper."]
    caregiver:
      - ["Hi Margaret. How is Arthur this morning?", "More breathless than he was. He had to stop halfway up the stairs last night."]
      - ["Have you weighed him today?", "Yes. Eighty and a half this morning. He was seventy-eight and a half on Tuesday."]
      - ["Are you doing his pill box this week?", "I'll do it tonight from the list on the fridge, same as always."]
      - ["Is he severely breathless while sitting still, faint, or difficult to wake now?", "He is awake and talking, and his breathing settles when he sits. He is more puffed on the stairs."]
      - ["His worsening breathlessness and weight gain after heart failure discharge need urgent medical assessment today. Call 999 if he is severely breathless at rest, collapses, becomes hard to wake, or worsens quickly. Otherwise call the GP urgent line or 111 now. Can you call?", "I keep hoping he will settle. I'll try to call, but I haven't done it yet."]
      - ["Please call now. We can stop this check-in while you arrange urgent assessment."]
  - day: 8
    patient:
      - ["Hello Arthur. How did you sleep?", "In the chair. I couldn't get my breath lying flat, so I came down."]
      - ["Did that help?", "A bit. My neck's stiff now."]
    caregiver:
      - ["Hi Margaret. How was the night?", "Not good. He came downstairs at three and slept in his armchair sitting up. He said he couldn't breathe lying down."]
      - ["Is Arthur struggling to breathe while sitting still, faint, or difficult to wake right now?", "He's awake and can talk, but he is breathless after walking across the room and needs to sit upright. I don't know what his pulse or blood pressure is."]
      - ["Worsening breathlessness, needing to sleep upright, swelling and weight gain after heart failure discharge need urgent assessment today. Call 999 if breathing is severe at rest, he becomes faint or hard to wake, or worsens quickly. Otherwise contact urgent medical care now and do not wait for a routine appointment. What is making this difficult?", "I'm frightened I'll give him the wrong tablets, and I don't have a car. I'll call 111 now and ask for help getting him assessed. I'll stay with him."]
      - ["Did anyone respond to the earlier messages?", "No. I didn't call again or use 111 because I hoped he would settle. I can see he is worse now, so I will call now."]
      - ["Please make that call now. We can stop this check-in while you arrange urgent assessment."]
  - day: 9
    patient:
      - ["Good morning, Arthur. How are you?", "I'm fine. Margaret's making a fuss about tablets."]
      - ["How is your breathing?", "All right sitting down."]
      - ["Did you sleep in your bed last night?", "The chair. It's comfier."]
    caregiver:
      - ["Hi Margaret. What happened after you called for urgent help?", "I called 111 yesterday. They advised us to go to the emergency department. I phoned my neighbour myself and asked her to take us. We were there most of the day, but I don't have the papers with me and I don't know the results."]
      - ["Have you had a chance to look at the hospital papers?", "I got them out last night after all that. In the pharmacy bag there's a box of furosemide that hasn't been opened, and a box of metoprolol 25s. His pill box has the 50s from the old list."]
      - ["What does the letter say?", "It says something about stopping the sleeping tablet, but I can't make head or tail of the rest. He's had his sleeping tablet every night since he came home."]
      - ["What are you going to do?", "I haven't changed anything. I don't want to get it wrong, so I'd rather the doctor tells me which list is right."]
      - ["How are his ankles today?", "His ankles are up like balloons."]
      - ["Has anything changed with his tablets?", "No, I've left the box as it is until somebody tells me."]
      - ["What did he weigh this morning?", "Eighty-one."]
      - ["Is he severely breathless while sitting still, faint, or difficult to wake now?", "He is awake and answering, and settles sitting upright. He still cannot lie flat and his ankles are swollen."]
      - ["His continued breathing difficulty and swelling after the emergency visit need urgent reassessment today. Call 999 if he is severely breathless at rest, collapses, becomes hard to wake, or worsens quickly. Otherwise call the GP urgent line or 111 now, and explain that the medicine instructions are unclear. Can you call?", "I am tired after yesterday, but I will call the surgery now or 111 if they cannot help. I won't change the tablets myself."]
      - ["Please make that call now. We can stop this check-in while you arrange reassessment."]
  - day: 10
    patient:
      - ["Hello Arthur. How are you feeling today?", "Tired. Margaret says I'm to see the doctor."]
      - ["Is there anything you want to ask the doctor?", "Don't stop my sleeping tablet. I can't sleep without it."]
      - ["How is your breathing?", "Bit tight. I'm all right in the chair."]
    caregiver:
      - ["Hi Margaret. How is Arthur since the emergency department visit?", "Still breathless when he walks and his ankles are swollen. I don't have the hospital papers yet, so I can't tell what they found."]
      - ["How is he when he wakes?", "Still very dozy in the mornings."]
      - ["What would you like the doctor to know?", "Which list is the right one, the fridge list or the hospital one? I don't want to be giving him the wrong things."]
      - ["How are you coping?", "I'm worn out, to be honest. I keep thinking I've done something wrong."]
      - ["Is he awake and talking normally now, or severely breathless while sitting?", "He is awake and answering me, and settles sitting up. Walking still makes him breathless. I haven't reached his GP since the hospital visit."]
      - ["Persistent breathlessness and swelling after that visit need urgent clinical reassessment today. Tell the GP or 111 that the medicine instructions are still unclear. Use 999 if he has severe breathing difficulty at rest, collapses or becomes hard to wake. Can you call now?", "Yes. I will call the surgery now, or 111 if they cannot help. I will take both lists and the packets; I won't change doses on my own."]
units:
  - id: ehr-lorazepam-stopped
    content: The discharge record stops lorazepam 0.5 mg at bedtime, recorded since 2023, because of night-time confusion on the ward and fall risk. It gives no taper or withdrawal monitoring plan; it asks for verification of long-term use and a prescriber-led reduction and monitoring plan before home administration changes.
    anchors:
      - source: MedicationRequest/med-lorazepam
        quote: Stopped at hospital discharge because of night-time confusion and fall risk
      - source: DocumentReference/note-discharge
        quote: No taper or withdrawal monitoring plan given. GP to verify long-term use and agree a prescriber-led reduction and monitoring plan promptly before changing home administration.
    reporter: FHIR record
    event_time: "2026-06-06"
    reported_at: "2026-06-08"
    priority: essential
    must_state: ["the discharge record stops lorazepam but gives no taper or withdrawal plan"]
    uncertainty: Prescribing record; it does not show what is given at home, and long-term use is recorded but not verified.
  - id: ehr-furosemide-started
    content: The discharge record starts furosemide 40 mg once daily in the morning as a new medicine for heart failure.
    anchors:
