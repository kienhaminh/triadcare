        quote: 40 mg by mouth once daily in the morning
      - source: DocumentReference/note-discharge
        quote: furosemide 40 mg each morning started.
    reporter: FHIR record
    event_time: "2026-06-06"
    reported_at: "2026-06-08"
    priority: essential
    must_state: ["furosemide 40 mg each morning started at discharge"]
    uncertainty: Prescribing record; it does not show what is given at home.
