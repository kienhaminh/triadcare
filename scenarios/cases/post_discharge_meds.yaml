    date: "2023-11-20"
  - type: MedicationRequest
    id: med-furosemide
    medication: Furosemide 40 mg tablet
    dosage: 40 mg by mouth once daily in the morning
    status: active
    date: "2026-06-06"
    note: New at discharge for heart failure.
  - type: Encounter
    id: encounter-memory-review
    kind: Memory clinic follow-up
    status: finished
    date: "2026-02-10"
    reason: Review of Alzheimer dementia
  - type: DocumentReference
    id: note-memory-review
    title: Memory clinic follow-up note
    date: "2026-02-10"
    author: Memory clinic
    text: >-
      Slow decline since last year. MMSE 19 today. Lives with his wife, who manages all his
      medicines with a weekly pill box. Needs help with appointments and paperwork. Continue
      donepezil 10 mg at night. Review in six months.
  - type: Encounter
    id: encounter-admission
    kind: Hospital admission, cardiology ward
    class: IMP
    class_display: inpatient encounter
    status: finished
    date: "2026-06-01"
    end: "2026-06-06"
    reason: Acute decompensated heart failure
  - type: DocumentReference
    id: note-discharge
    title: Hospital discharge summary
    date: "2026-06-06"
    author: Cardiology ward
    text: >-
      Admitted 2026-06-01 with breathlessness and leg swelling. New diagnosis of heart failure with
      reduced ejection fraction; ejection fraction 35% on echocardiogram. Treated with intravenous
      furosemide. Discharge weight 78.4 kg. Medication changes: furosemide 40 mg each morning
      started. Metoprolol reduced from 50 mg to 25 mg twice daily because of a heart rate of 48 per
      minute. Heart rate 58 per minute in sinus rhythm on ECG before discharge; lower-dose beta-blocker
      continued pending cardiology review of heart failure beta-blocker therapy. Lorazepam 0.5 mg nightly, recorded since 2023, stopped because of night-time
      confusion on the ward and fall risk. No taper or withdrawal
      monitoring plan given. GP to verify long-term use and agree a prescriber-led reduction and monitoring plan
      promptly before changing home administration. Donepezil and atorvastatin unchanged. Other heart failure medicines not started yet because of low blood
      pressure on the ward; cardiology clinic to start them. Please weigh daily and contact the GP if weight rises by more than 2
      kg in three days. GP to check kidney function and potassium in one week. Cardiology clinic
      follow-up to be arranged.
imaging:
  - study_id: CASE-P202-MRI
    modality: mri
    date: "2025-10-14"
