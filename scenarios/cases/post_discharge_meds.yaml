  - type: MedicationRequest
    id: med-metoprolol-25
    medication: Metoprolol tartrate 25 mg tablet
    dosage: 25 mg by mouth twice daily
    status: active
    date: "2026-06-06"
    note: Reduced from 50 mg twice daily because of a heart rate of 48 per minute in hospital.
  - type: MedicationRequest
    id: med-lorazepam
    medication: Lorazepam 0.5 mg tablet
    dosage: 0.5 mg by mouth at bedtime
