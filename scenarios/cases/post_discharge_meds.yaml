schema: scenario_v4
id: post_discharge_meds
split: held_out
title: Medication reconciliation after a hospital discharge
summary: >
  The patient came home from a heart failure admission two days before the check-ins start. The
  discharge record stops lorazepam, starts furosemide and reduces metoprolol. At home his wife
  still fills the weekly pill box from the old list on the fridge and is not sure whether the
  hospital changed anything. Over the week his weight, ankle swelling and breathlessness rise, and
  he is drowsy and unsteady. She is advised to seek urgent assessment when breathlessness worsens,
  but delays. When he cannot lie flat, she is advised again and calls 111. She later reports that he was taken to the emergency department,
  but has no papers or results. She does not change his pill box while the medicines remain unclear.
start_date: "2026-06-08"
patient:
  id: P-202
  name: Arthur
  gender: male
  birth_year: 1942
  persona: Mild to moderate Alzheimer dementia. Retired bus driver. Lives with his wife. Likes cricket on the radio and the newspaper. Tends to say all is well.
caregiver:
  name: Margaret
  relation: wife
  persona: Lives with him and does all his tablets. Has poor near vision for small print and is a heavy sleeper. Their daughter, who usually helps with paperwork, is away until the middle of the second week.
baseline:
  date: "2026-02-10"
  diagnosis: Dementia due to Alzheimer disease, mild to moderate stage
  mmse: 19
  moca: 14
  cdr_global: 1
  cdr_sb: 6.5
  faq: 15
