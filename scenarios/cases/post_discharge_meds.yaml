  - type: Condition
    id: condition-hypertension
    code: Essential hypertension
    status: active
    date: "2014-04-22"
  - type: Condition
    id: condition-heart-failure
    code: Heart failure with reduced ejection fraction
    status: active
    date: "2026-06-03"
  - type: MedicationRequest
    id: med-donepezil
    medication: Donepezil 10 mg tablet
    dosage: 10 mg by mouth once daily at bedtime
    status: active
    date: "2024-03-12"
  - type: MedicationRequest
    id: med-atorvastatin
    medication: Atorvastatin 20 mg tablet
    dosage: 20 mg by mouth once daily in the evening
    status: active
    date: "2019-08-30"
  - type: MedicationRequest
    id: med-metoprolol-50
    medication: Metoprolol tartrate 50 mg tablet
    dosage: 50 mg by mouth twice daily
    status: stopped
    status_reason: Dose reduced to 25 mg twice daily at hospital discharge
    date: "2021-05-10"
