    reporter: caregiver
    event_time: 2026-06-12 to 2026-06-17
    reported_at: "2026-06-17"
    priority: supporting
    must_state: ["Margaret has changed nothing and asks which medicine list is right"]
    uncertainty: No limit beyond the cited source.
  - id: drowsy-unsteady
    content: Arthur is very drowsy in the mornings, more than usual after his sleeping tablet. Once, getting up for the toilet at about two o'clock at night, he was unsteady and held the door frame; Margaret steadied him and he did not fall.
    anchors:
      - source: day-4:caregiver
        quote: He was wobbly when he got up for the toilet about two o'clock. He was holding on to the door frame and I had to steady him.
      - source: day-4:caregiver
        quote: Very dozy until about eleven. He's always been slow after his sleeping tablet, but this seems more.
      - source: day-10:caregiver
        quote: Still very dozy in the mornings.
      - source: day-6:caregiver
        quote: I'm a heavy sleeper, so I wouldn't always hear him.
    reporter: caregiver
    event_time: Unsteady episode at about 02:00 on 2026-06-11; morning drowsiness reported 2026-06-11 and 2026-06-17
    reported_at: "2026-06-17"
    priority: supporting
    must_state: ["he is very drowsy in the mornings and was unsteady once at night"]
    uncertainty: One witnessed night episode; Margaret is a heavy sleeper and may not hear him at night.
  - id: patient-wants-sleeping-tablet
    content: Arthur asks the doctor not to stop his sleeping tablet because he cannot sleep without it.
    anchors:
      - source: day-10:patient
