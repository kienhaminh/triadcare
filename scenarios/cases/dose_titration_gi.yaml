schema: scenario_v4
id: dose_titration_gi
split: dev
title: Stomach upset and vivid dreams after a donepezil dose increase
summary: >
  Donepezil went up from 5 mg to 10 mg at bedtime ten days before the check-ins start. At home
  Harold has morning nausea, a poorer appetite, vivid dreams, one loose stool and one dizzy spell
  in the bathroom. He blames rich Easter food; his daughter thinks the dementia is getting worse.
  She later moves the start of the poor appetite back to the week before Easter. After a new near-faint
  on standing, Claire is advised to contact a clinician urgently. She reports that a review is booked
  for the next day; no pulse, blood pressure or ECG has yet been checked. The timing leaves the cause
  uncertain, and nobody has weighed him at home.
start_date: "2026-04-06"
patient:
  id: P-102
  name: Harold
  gender: male
  birth_year: 1944
  persona: Mild Alzheimer dementia. Retired bus driver. Cheerful, plays things down, repeats himself.
caregiver:
  name: Claire
  relation: daughter
  persona: Lives with her father. Works at a school office on Monday, Wednesday and Friday mornings.
baseline:
  date: "2025-10-20"
  diagnosis: Dementia due to Alzheimer disease, mild stage
  mmse: 20
  moca: 15
  cdr_global: 1
  cdr_sb: 5.5
  faq: 13
