days:
  - day: 1
    patient:
      - ["Good morning, Harold. Did you have a nice Easter?", "Lovely, thanks. We went over to my sister Joan's. Too much food, as usual."]
      - ["Have you had any breakfast yet?", "A cup of tea. I'm still full from yesterday, I should think."]
      - ["What are you up to today?", "Claire's off work, so we might go for a drive. She's doing the washing first."]
    caregiver:
      - ["Hi Claire. How did Easter go?", "Really well. It's the bank holiday, so I'm home today. Dad enjoyed seeing everyone at my aunt's."]
      - ["How is he today?", "Fine. Bit slow this morning, but we were all late to bed."]
  - day: 2
    patient:
      - ["Hello Harold. How are you feeling today?", "My stomach's not right. I felt sick when I got up this morning."]
      - ["Were you sick at all?", "No, nothing came up. It went off after a while. I had a bit of dry toast."]
      - ["What do you think caused it?", "All that rich food at Joan's. Lamb and the trifle and then the chocolate. I'm not used to it."]
    caregiver:
      - ["Hi Claire. How was your dad this morning?", "He said he felt queasy when he got up. He's blaming the Easter lunch."]
      - ["Did he eat today?", "Dry toast at breakfast, then a proper lunch. He seemed fine by the afternoon."]
      - ["How are you doing?", "Fine. Back to normal after the long weekend."]
  - day: 3
    patient:
      - ["Morning, Harold. How did you sleep?", "Oh, all right. I had a dream, I think, but I can't tell you what it was."]
      - ["How is your stomach today?", "Not bad. A bit off first thing, same as yesterday."]
      - ["What's the plan for today?", "Claire's at work. I'll have the radio on and do my crossword."]
    caregiver:
      - ["Hi Claire. How is your dad today?", "I've been at work all morning, so I've only just seen him. He's had his lunch."]
      - ["How was his night?", "He woke me at about two. He was standing on the landing saying his mum was downstairs and he had to let her in."]
      - ["What happened then?", "I told him it was a dream and walked him back to bed. He went straight off again. His mum died forty years ago."]
      - ["Has that happened before?", "No. He's always slept right through, even since the diagnosis."]
  - day: 4
    patient:
      - ["Hello Harold. How are you getting on?", "Not too bad. I'm not hungry much, but I'm not doing much either."]
      - ["Have you felt sick again?", "In the mornings, a bit. Then it goes. It's still that Easter food, I reckon."]
      - ["Anything you'd like help with?", "No, Claire does everything. I'm fine."]
    caregiver:
      - ["Hi Claire. How has his week been so far?", "He's been saying he feels sick most mornings now. He hasn't actually been sick."]
      - ["And his appetite?", "He's eating less since the weekend. Breakfast is the worst, he hardly touches it. I put it down to all the chocolate."]
      - ["How do you feel about it all?", "Honestly, I think it's the dementia moving on. He's just not himself this week."]
      - ["That sounds worrying. How are you coping?", "OK. I try not to let him see I'm worried."]
  - day: 5
    patient:
      - ["Good morning, Harold. How are you today?", "My stomach ran off last night. Just the once, mind. It was that takeaway, I expect."]
      - ["How do you feel now?", "All right now. A bit washed out."]
      - ["Are you drinking enough?", "Tea, plenty of tea. And a glass of water with my tablets."]
    caregiver:
      - ["Hi Claire. How was your dad last night?", "I was out at a school concert till late, so I didn't see him. He was in bed when I got in."]
      - ["Has he told you anything today?", "No, I left early for work. We had a takeaway on Wednesday, but he hasn't mentioned his tummy to me."]
  - day: 6
    patient:
      - ["Hello Harold. What have you been doing today?", "Claire took me to the garden centre. We bought some tomato plants."]
      - ["How was your appetite today?", "Dinner was lovely. Claire did a shepherd's pie."]
      - ["Any worries?", "No. Nothing at all."]
    caregiver:
      - ["Hi Claire. How was today?", "Good day. He enjoyed the garden centre and chatted to the man about tomatoes."]
      - ["How was he with food?", "Hardly any breakfast again, but he ate a full dinner tonight and had seconds."]
      - ["Anything else?", "No, a good day. That's nice for a change."]
  - day: 7
    patient:
      - ["Good morning, Harold. How are you feeling?", "Bit wobbly. I went funny in the bathroom and had to grab the sink."]
      - ["Did you fall or hurt yourself?", "No, no. I just held on till it passed. It was nothing."]
      - ["How is your stomach?", "So-so. Sick again first thing. I'll be glad when it settles."]
    caregiver:
      - ["Hi Claire. How is your dad today?", "He gave me a fright this morning. I heard him shout and found him in the bathroom holding on to the sink."]
      - ["What did he say happened?", "He said his head went swimmy when he stood up from the toilet. It passed in about a minute and he walked back to his chair. He didn't fall."]
      - ["Has he had turns like that before?", "Not that I've seen. I'm not with him every minute, though."]
      - ["How are you after that?", "A bit shaken. I'm OK."]
      - ["How is he right now? Is he still dizzy, hard to wake, short of breath, or having chest pain?", "He's sitting in the kitchen and talking normally now. He says the dizziness has gone. I haven't checked his pulse or blood pressure."]
      - ["A new near-faint after a dose increase needs same-day clinical advice and review. If he faints, has chest pain, becomes difficult to wake, or the spell returns and does not settle, call 999. Please do not change the dose yourself. Can you seek urgent advice today?", "It's Sunday, so I'll call 111 now rather than wait for the clinic. I can stay with him while I wait for advice."]
      - ["Please make that call today. We can stop this check-in while you arrange clinical advice."]
  - day: 8
    patient:
      - ["Hello Harold. How was your night?", "I was back on the buses. Driving the number 12 all night, clear as anything."]
      - ["Was that a dream?", "Must have been. It felt real. I woke up and couldn't get back off for ages."]
      - ["How are you today?", "Tired, but fine."]
    caregiver:
      - ["Hi Claire. How are his tablets going?", "Fine. I fill his pill box on Sunday nights. The memory tablet is the bigger one since the clinic, and it goes in the bedtime slot. The cholesterol one goes in with his tea."]
      - ["Has he missed any?", "No, the box has been empty every morning when I check."]
      - ["Anything else this week?", "I've been at work this morning, so not much to add. He seemed tired at lunch."]
  - day: 9
    patient:
      - ["Good morning, Harold. Have you had breakfast?", "Half a biscuit. I don't fancy much in the mornings these days."]
      - ["Do your clothes still fit all right?", "Oh, I think so. Claire says my belt needs a new hole. She fusses."]
      - ["How is your memory today?", "Same as ever. Can't remember what I came upstairs for, but who can?"]
    caregiver:
      - ["Hi Claire. How is he eating now?", "Still poor in the mornings, better by tea time. Thinking back, it started before Easter, not after. He wouldn't touch his porridge the week before, and I thought he was just being fussy."]
      - ["Do you think he has lost weight?", "His trousers look looser and he's on a tighter hole on his belt. But we don't have scales, so I haven't weighed him."]
      - ["How are you managing?", "OK. Work has been good about it."]
  - day: 10
    patient:
      - ["Hello Harold. You're seeing the doctor soon. Anything you want to ask?", "Maybe something for my stomach. It's not been right since Easter."]
      - ["Anything else on your mind?", "No. Claire worries too much."]
      - ["How did you sleep?", "Fine. No dreams I can remember."]
    caregiver:
      - ["Hi Claire. What would you like the doctor to know?", "That he's not been right for a couple of weeks. Off his food, sick in the mornings, these funny dreams, and that dizzy turn on Sunday."]
      - ["Is there something you'd like to ask?", "Whether this means the dementia is getting worse. I need to know what to expect."]
      - ["What did you do after the dizzy spell?", "I called 111 on Sunday and rang the clinic on Monday. They've booked a review for tomorrow; we haven't had his pulse, blood pressure or an ECG checked yet."]
      - ["Anything else?", "No, that's the main thing."]
      - ["Has the dizzy feeling happened again, or is he unwell now?", "No, not since Sunday. He's talking normally, but I've not checked his pulse or blood pressure."]
      - ["Please confirm with the clinic today whether tomorrow is soon enough, given the near-faint, ongoing symptoms and higher dose. Seek urgent help if symptoms return; call 999 for collapse, chest pain or difficulty waking. Do not change the dose yourself.", "I will ring them today and explain that he still feels sick. I won't change the tablets on my own."]
