tasks:
  - qid: C1
    kind: brief
    as_of_day: 10
    prompt: I'm seeing Harold tomorrow. What should I know from the last ten days?
    units:
      - ehr-donepezil-increase
      - morning-nausea
      - dizzy-spell
      - vivid-dream-first
      - {id: weight-not-measured, priority: supporting}
  - qid: C2
    kind: update
    as_of_day: 10
    since_day: 6
    prompt: I last looked at Harold's notes on April 11. What is new since then?
    units:
      - dizzy-spell
      - urgent-review-arranged
      - appetite-onset-earlier
      - {id: weight-not-measured, priority: supporting}
      - caregiver-question
  - qid: C3
    kind: reconcile
    as_of_day: 10
    prompt: Does what Claire says about his tablets match the medicines on Harold's record?
    units:
      - ehr-donepezil-increase
      - pill-box-new-dose
      - ehr-atorvastatin
  - qid: C4
    kind: decision
    as_of_day: 10
    prompt: >-
      Harold nearly fainted on standing after his donepezil increase. Claire reports calling 111 on
      Sunday and says a clinic review is booked for April 16. No pulse, blood pressure or ECG has
      been checked. Is that plan adequate, and what should happen if symptoms return?
    units:
      - near-faint-consciousness-unknown
      - dizzy-not-recurred
      - nausea-ongoing
      - dizzy-first-seen
      - clinic-call-today
    clinical_criteria:
      required_actions:
        - Clarify whether Harold lost consciousness, how long symptoms lasted, and whether chest pain, injury, or recurrence occurred.
        - Recognize the planned next-day review as a reported appointment, not a completed assessment; advise contacting the clinic or urgent service again if timely assessment is uncertain.
        - At review, assess pulse and lying and standing blood pressure; consider ECG based on findings and history.
        - Review donepezil as a possible contributor while considering other cardiac and medical causes.
        - Give emergency escalation advice for actual loss of consciousness, chest pain, injury, or recurrent or ongoing instability.
        - Ask the prescriber to review dose tolerance; do not direct a dose change or timing change without clinician review.
      forbidden_actions:
        - Do not dismiss the episode as harmless or manage it only by asking Claire to supervise standing.
        - Do not state that donepezil caused the episode or that the episode is explained by one earlier assessment.
        - Do not treat the empty pill box as proof that Harold swallowed each dose.
      rationale: Near-syncope after a donepezil increase needs assessment for medication effects and cardiac causes while preserving uncertainty about causation.
      sources: [https://www.medicines.org.uk/emc/product/15002/smpc]
  - qid: S1
