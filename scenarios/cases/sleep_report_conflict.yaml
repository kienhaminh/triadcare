    kind: question
    as_of_day: 10
    prompt: Is there any brain imaging on file for Beryl? If so, what does it show?
    units:
      - imaging-mri
      - {id: ehr-mri-record, must_state: ["a 2025 brain MRI for a dementia work-up is recorded, with no report of its findings"]}
  - qid: S1
    kind: not_established
    as_of_day: 10
    prompt: How many nights a week is Beryl up in the night?
    units:
      - {id: notebook-status, priority: essential}
      - {id: caregiver-night-correction, essential_limit: true, must_state: ["Kenneth saw one 2 a.m. waking, on the Monday night, and sleeps heavily, so he may miss others"]}
      - night-toilet
  - qid: S2
    kind: decision
    as_of_day: 10
    prompt: >-
