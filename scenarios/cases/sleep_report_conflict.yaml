tasks:
  - qid: C1
    kind: brief
    as_of_day: 10
    prompt: I'm seeing Beryl on July 22. Kenneth is worried about her night-time waking and his own disrupted sleep. What should I know from the last ten days?
    units:
      - patient-full-night
      - caregiver-night-correction
      - patient-declines-sleeping-tablet
      - daytime-naps
      - {id: sleeping-tablet-request, priority: supporting}
  - qid: C2
    kind: update
    as_of_day: 10
    since_day: 4
    prompt: I last looked at Beryl's notes on July 9. What is new since then?
    units:
      - caregiver-night-correction
      - sleeping-tablet-request
      - patient-declines-sleeping-tablet
      - night-toilet
      - notebook-status
  - qid: C3
