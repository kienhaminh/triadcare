days:
  - day: 1
    patient:
      - ["Good morning, Beryl. How are you today?", "Very well, thank you. Ken's done the crossword already, the cheat."]
      - ["How have you been sleeping lately?", "Oh, I sleep like a log. Always have."]
      - ["What are you doing today?", "The library van comes this afternoon. I like the big print ones."]
    caregiver:
      - ["Hi Kenneth. How has Beryl been?", "Much as usual. Cheerful enough. She got three books from the library van."]
      - ["How are her nights at the moment?", "Mostly fine. She goes up about ten. Now and then I hear her up for the loo."]
      - ["And how are you?", "Fair. My back's playing up, but I manage."]
  - day: 2
    patient:
      - ["Good morning, Beryl. How did you sleep last night?", "I slept right through. Didn't stir till Ken brought my tea up."]
      - ["Do you feel rested?", "Yes, fresh as a daisy."]
    caregiver:
      - ["Hi Kenneth. How was today?", "Nothing much to report. I put the bins out first thing and we had a quiet one."]
      - ["Did she eat well?", "Yes, a good lunch. Soup and a cheese sandwich."]
      - ["How are you?", "Bit weary, to be honest. Nothing an early night won't fix."]
  - day: 3
    patient:
      - ["Good morning, Beryl. How was your night?", "Lovely, thank you. I slept well."]
      - ["Did you get up in the night at all?", "No, I don't think so. I'd remember."]
      - ["What's on today?", "Ken wants to go to the garden centre. He'll come back with more pots."]
    caregiver:
      - ["Hi Kenneth. How has Beryl been?", "Fine in the day. But I meant to tell you, she was up about two o'clock last night."]
      - ["What happened?", "I found her in the front room in her dressing gown, opening the curtains. She thought it was morning."]
      - ["Was she hurt or upset?", "No, no fall and nothing hurt. She was a bit muddled. I walked her back to bed and she settled within half an hour."]
      - ["Thank you. If she gets up at night again, please note the time and what she was doing. Is there anything on the stairs she could trip on at night?", "Not really. I'll leave the landing light on from now on."]
  - day: 4
    patient:
      - ["Hello Beryl. How are you today?", "Not bad. A bit stiff in the knees."]
      - ["How do you spend your afternoons?", "Reading, mostly. Or the radio."]
    caregiver:
      - ["Hi Kenneth. How has today gone?", "Quiet. She sleeps in the chair after lunch, a good two hours most days, and sometimes again before tea."]
      - ["Is that new?", "It's crept up since the spring, I'd say. She used to be on the go all afternoon."]
      - ["How have her nights been this week?", "I haven't heard her since that once."]
  - day: 5
    patient:
      - ["Good morning, Beryl. How did you sleep?", "Very well. I always do."]
      - ["Any aches today?", "Only the knees. I had a paracetamol with my breakfast."]
    caregiver:
      - ["Hi Kenneth. Anything to add to what you told us this week?", "Yes. I got the night wrong when I told you about the curtains. It was Monday night, not Tuesday."]
      - ["How do you know it was Monday night?", "The bins go out first thing Tuesday, and I remember being shattered putting them out after being up with her."]
      - ["And Tuesday night?", "I didn't hear her at all Tuesday night. But I sleep heavy, so I can't swear she didn't get up."]
  - day: 6
    patient:
      - ["Hello Beryl. Ken says you sometimes nap after lunch. Do you?", "I only rest my eyes after lunch. I don't sleep in the day."]
      - ["How do you feel in the evenings?", "Wide awake. I like to see the late news."]
    caregiver:
      - ["Hi Kenneth. What is her evening routine?", "She has her tablet and a big mug of tea at about ten, then goes up."]
      - ["Which tablet is that?", "The memory one, donepezil. We were told to give it at night."]
      - ["Thank you. Please keep giving her tablets as prescribed; the doctor can review the timing. Does she drink much in the evening?", "Two or three mugs of tea after six, I'd say. She does love her tea."]
  - day: 7
    patient:
      - ["Good morning, Beryl. How was your night?", "Fine. I had a funny dream about the school where I taught. Very real, it was."]
      - ["Did the dream upset you?", "No. It was nice, really. All the children."]
    caregiver:
      - ["Hi Kenneth. How was the weekend?", "Our daughter rang this afternoon. Beryl was chatty with her."]
      - ["Would you be willing to write down when Beryl goes to bed, any time you hear her up at night, and her naps, for the doctor?", "I can do that. I'll keep a notebook by the bed, starting tonight."]
  - day: 8
    patient:
      - ["Hello Beryl. Do you get up in the night for anything?", "I get up for the loo once most nights, then straight back off. Everyone does at my age."]
      - ["Does it hurt or sting when you pass water?", "No, nothing like that."]
    caregiver:
      - ["Hi Kenneth. How was last night?", "I heard her go to the toilet about three, and she went back to bed on her own."]
      - ["Did she seem confused?", "Didn't seem to be. She was back asleep before I was."]
      - ["How are you sleeping?", "Not great. I lie there listening out for her."]
  - day: 9
    patient:
      - ["Good morning, Beryl. Ken told us he found you downstairs one night last week. Do you remember that?", "I don't remember getting up at all. If Ken says I did, maybe I did."]
      - ["How do you feel in the mornings?", "I don't feel tired. I don't know what the fuss is about."]
    caregiver:
      - ["Hi Kenneth. Is there anything you'd like the doctor to know?", "Could the doctor give her something to help her sleep? My sister takes a sleeping tablet and swears by it."]
      - ["What worries you most about her nights?", "That she'll go down the stairs in the dark, or I'll sleep through it. I'm not getting much sleep myself."]
      - ["I cannot start or advise a sleeping tablet. The doctor can talk through the options with you both. Does Beryl know you are asking?", "Not yet. I'll mention it to her tonight."]
  - day: 10
    patient:
      - ["Hello Beryl. Ken mentioned a sleeping tablet. What do you think?", "I don't want sleeping tablets. They make you dopey, and I'd fall on the stairs."]
      - ["Is there anything you'd like the doctor to know?", "Only that I sleep perfectly well. Ken worries."]
      - ["Would you be happy to talk with the doctor about your sleep and your tablets?", "Yes, I'll talk to the doctor. But no sleeping pills."]
    caregiver:
      - ["Hi Kenneth. How is the notebook going?", "I've written down three nights. She went up about ten each time. The only time I heard her was Sunday, for the toilet."]
      - ["Have you written down her naps?", "Two hours after lunch on two of the days. I missed one, I was out at the shops."]
      - ["Has anyone changed her tablets or started anything new?", "No. Nothing's been changed and she's not on anything for sleep."]
      - ["Thank you. Please bring the notebook to her review. Is the review still booked?", "Yes, the twenty-second. I haven't spoken to the surgery about her nights yet."]
