schema: scenario_v4
id: sleep_report_conflict
split: held_out
title: A full night by her account and a 2 a.m. waking by her husband's
summary: >
  Beryl says she slept right through the Monday night. Two days later Kenneth reports that he
  found her in the front room at about 2 a.m. opening the curtains, thinking it was morning; she was not
  hurt. He first says it was "last night", then corrects it to the Monday night, the night she said
  she slept through. She does not remember getting up. Possible contributors are in the sources but
  none is established: donepezil and a mug of tea at about 10 p.m., night toilet trips, and long
  afternoon naps. Kenneth asks for a sleeping tablet; Beryl does not want one. His notebook
  covers three nights, nothing has been changed or started, and the surgery has not been told.
start_date: "2026-07-06"
patient:
  id: P-207
  name: Beryl
  gender: female
  birth_year: 1945
  persona: Mild Alzheimer dementia. Retired primary school teacher. Lives with her husband in a two-storey house. Cheerful, confident about her own routines, and does not see a problem with her sleep.
caregiver:
  name: Kenneth
  relation: husband
  persona: Aged 83, lives with Beryl and gives her tablets. Has a bad back. Sleeps heavily and is not always sure what happens at night.
record_target: document-sleep-note
source_open: note-memory-review
baseline:
  date: "2026-05-12"
  diagnosis: Dementia due to Alzheimer disease, mild stage
  mmse: 21
  moca: 15
  cdr_global: 1
  cdr_sb: 5.0
  faq: 11
