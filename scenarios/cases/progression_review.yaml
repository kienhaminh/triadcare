      required_actions:
        - State that progression to a moderate stage is not established yet, because the July score is confounded by an acute infection and missing glasses, and formal functional reassessment is outstanding; the persistent home losses may suggest progression.
        - Recommend repeat cognitive testing when she is well, with her glasses, and a structured functional assessment with Gordon as informant at the planned review.
        - Review contemporaneous evidence for possible delirium during the July illness, and assess current residual symptoms and other contributors; with no delirium screen recorded, whether delirium occurred remains uncertain.
        - Act on the smoke incident before the 22 September review, and agree an interim cooking-safety plan now, including the home safety visit Maureen is willing to consider.
