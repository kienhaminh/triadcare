    reporter: FHIR record
    event_time: Dated 2026-03-10
    reported_at: "2026-06-22"
    uncertainty: Recorded before Helen's statements of 2026-06-24 and 2026-06-28.
    priority: essential
    must_state: ["the March authorisation includes mood and finances and asks for review if Helen's wishes change"]
  - id: ehr-reporting-note
    content: The home check-in reporting note dated 2026-03-10 says Claire reports for Helen within the 2026-03-10 authorisation.
    anchors:
      - source: DocumentReference/document-reporting-note
        quote: Daughter Claire reports for Helen at home check-ins within the information-sharing authorisation of 2026-03-10.
    reporter: FHIR record
    event_time: Dated 2026-03-10
    reported_at: "2026-06-22"
    uncertainty: No limit beyond the cited source.
    priority: supporting
    must_state: ["the reporting note relies on the March authorisation"]
  - id: triage-alertness-change
    content: Claire reports Helen was very hard to wake on the phone at nine on 2026-06-30 and kept drifting
      off. By a second call at lunchtime she was herself again. Claire did not see her in person that morning.
    anchors:
    - source: day-9:caregiver
      quote: She was very hard to wake when I rang at nine, she kept drifting off on the phone. When I phoned
        again at lunchtime she was herself again.
    - source: day-9:caregiver
      quote: No, I couldn't go round before work, so I only know from the phone.
    reporter: caregiver
    event_time: Morning of 2026-06-30
    reported_at: '2026-06-30'
    uncertainty: Phone contact only; no in-person examination or current vital signs.
    priority: essential
    essential_limit: true
    must_state: ["Claire reports by phone that Helen was very hard to wake in the morning but better by lunchtime"]
  - id: triage-advice-followthrough
