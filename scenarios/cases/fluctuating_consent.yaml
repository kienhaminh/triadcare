        quote: Assessment of memory decline with marked day-to-day changes in alertness; attended with daughter. Rivastigmine patch started.
    reporter: FHIR record
    event_time: "2026-03-10"
    reported_at: "2026-06-22"
    uncertainty: No limit beyond the cited source.
    priority: supporting
    must_state: ["day-to-day changes in alertness were noted at the March assessment"]
  - id: ehr-rivastigmine
    content: The record shows rivastigmine 9.5 mg/24 h patch, one patch each morning with the previous patch removed, active since 2026-04-07 after an increase from 4.6 mg/24 h.
    anchors:
      - source: MedicationRequest/med-rivastigmine
        quote: Apply one 9.5 mg/24 h patch each morning and remove the previous patch; rotate the site
    reporter: FHIR record
    event_time: Active since 2026-04-07
    reported_at: "2026-06-22"
