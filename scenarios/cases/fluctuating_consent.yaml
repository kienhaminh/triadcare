    anchors:
      - source: MedicationRequest/med-sertraline
        quote: 50 mg by mouth once daily in the morning
      - source: MedicationRequest/med-sertraline
        quote: Started for low mood. Early follow-up is not documented in this record extract; a review is planned at about ten weeks.
    reporter: FHIR record
    event_time: Active since 2026-04-21
    reported_at: "2026-06-22"
    uncertainty: Prescribing record; does not confirm the doses taken or whether an early follow-up occurred.
    priority: essential
    must_state: ["sertraline 50 mg daily for low mood", "early follow-up is not documented in this record extract"]
  - id: ehr-mood-review-planned
    content: The record holds a planned GP sertraline review of mood and side effects on Friday 2026-07-03.
    anchors:
      - source: Encounter/encounter-mood-review
        quote: Sertraline review of mood and side effects; booked for Friday 2026-07-03.
    reporter: FHIR record
    event_time: "2026-07-03"
    reported_at: "2026-06-22"
    uncertainty: A planned encounter; it has not taken place yet.
    priority: essential
    must_state: ["sertraline review planned for Friday 3 July"]
  - id: ehr-old-authorisation
    content: An information-sharing authorisation dated 2026-03-10 lets Claire give and receive information for Helen about her health, medicines, appointments, mood and finances, and asks for review if Helen's wishes change.
    anchors:
      - source: DocumentReference/document-sharing-authorisation
        quote: Helen agrees that her daughter Claire may give and receive information on her behalf about her health, medicines, appointments, mood and finances.
      - source: DocumentReference/document-sharing-authorisation
