schema: scenario_v4
id: day_program_plan
split: held_out
title: Support plan that keeps daily walks when the caregiver cannot drive on two weekdays
summary: >
  Win has mild Alzheimer dementia and walks alone on a familiar park route every morning. A social
  worker sent a referral to Oakfield day centre, which has places on Tuesdays and Thursdays only,
  and recorded that her daughter Tessa could drive on any weekday. Over ten days Win refuses the
  centre and wants to keep her walks; she may try a Wednesday walking group with a neighbour, but she
  has not gone yet. One walk lasts nearly two hours, with no clear account of where she was. She
  refuses a GPS watch and agrees to carry her phone, which later runs flat. Tessa corrects the record
  that she cannot drive on Tuesdays or Thursdays because she works then. Nothing is arranged.
start_date: "2026-06-29"
patient:
  id: P-210
  name: Winifred
  gender: female
  birth_year: 1946
  persona: Mild Alzheimer dementia. Known as Win. Widowed, lives with her daughter in a semi-detached house near a park. Brisk, sociable, proud of her independence, and firm about her routine.
caregiver:
  name: Tessa
  relation: daughter
  persona: Aged 52, lives with her mother. Works long shifts at a hospital pharmacy on Tuesdays and Thursdays and takes the only car. At home on the other weekdays.
record_target: document-support-plan-note
source_open: document-social-work-note
