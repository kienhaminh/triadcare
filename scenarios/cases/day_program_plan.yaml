days:
  - day: 1
    patient:
      - ["Good morning, Win. How are you today?", "Very well. I've been round the park already."]
      - ["How was your walk?", "Lovely. Same way as always, past the pond and back by the church. I like to see the ducks."]
      - ["What does the walk mean to you?", "It's my bit of the day. I've walked that way every morning for thirty years and I'm not stopping now."]
    caregiver:
      - ["Hi Tessa. How has your mum been today?", "Fine. She was out the door by half nine and back for coffee about forty minutes later, same as usual."]
      - ["Any news since the social worker's visit?", "The social worker put her name down for Oakfield day centre. Mum hasn't said much about it."]
      - ["And how are you?", "Busy, but all right."]
  - day: 2
    patient:
      - ["Hello Win. Did you get out this morning?", "Yes, round the park. Tessa's at work today, so I had the place to myself."]
      - ["Has anyone talked to you about the day centre?", "Tessa keeps mentioning it. I'm not going to that centre. Sitting in a room doing quizzes all day isn't for me."]
    caregiver:
      - ["Hi Tessa. How was today?", "I was on a long shift, so I only rang her at lunch. She said she'd had her walk and was making soup."]
      - ["Did she mention the centre?", "She told me on the phone she isn't going. I'll try her again at the weekend."]
  - day: 3
    patient:
      - ["Good morning, Win. How are you?", "Grand. I bumped into Joyce from next door by the pond."]
      - ["What did you talk about?", "She goes to a walking group on Wednesday mornings, from the park gates. She said I should come."]
      - ["How do you feel about that?", "Maybe. I don't know any of them except Joyce."]
    caregiver:
      - ["Hi Tessa. How did today go?", "Good day. She had her walk and did the crossword with me after."]
      - ["How would getting to Oakfield work if she agreed to go?", "I can drive her most days, that's not the problem. The problem is getting her to agree to go."]
      - ["Anything else?", "No, all quiet."]
  - day: 4
    patient:
      - ["Hello Win. How was this morning?", "Wet. I went anyway, but only to the end of the road and back."]
      - ["How have you been otherwise?", "Fine. My knees don't like the rain, that's all."]
    caregiver:
      - ["Hi Tessa. How has today been?", "I was at work again. When I rang at lunchtime she said she'd only gone a short way because of the rain."]
      - ["Is there anything from earlier in the week you didn't get to tell us?", "Yes. On Monday she couldn't find her keys, and I had to remind her twice to put her walking shoes on. After that she went off and came back fine."]
  - day: 5
    patient:
      - ["Good morning, Win. How was your walk?", "Very nice. I sat on a bench by the bandstand in the sun and talked to a lady with a spaniel."]
      - ["Were you out longer than usual today?", "A bit, maybe. I wasn't lost, if that's what anyone thinks. I know that park like my own kitchen."]
    caregiver:
      - ["Hi Tessa. How was today?", "A bit of a fright. She was gone nearly two hours this morning instead of her usual forty minutes."]
      - ["What happened?", "She said she sat on a bench by the bandstand talking to someone with a dog. She came back cheerful and wasn't hurt, but I was about to go out looking for her. I don't know where she was the whole time."]
      - ["Has that happened before?", "Not that long, no. She's sometimes ten minutes late."]
  - day: 6
    patient:
      - ["Hello Win. Has anyone suggested a watch that shows where you are? What do you think?", "I'm not wearing a tag like a parcel. I'll take my mobile phone with me, that's enough."]
      - ["Will you keep the phone in your coat?", "Yes, in my coat pocket. Tessa can ring me if she's fretting."]
    caregiver:
      - ["Hi Tessa. How did today go?", "I asked her about one of those GPS watches. She won't have it. She's agreed to take her mobile on her walks instead."]
      - ["Does she use the phone?", "She can answer it. Whether she remembers to charge it is another matter."]
  - day: 7
    patient:
      - ["Good morning, Win. How are you?", "Fine. Tessa's been telling me about her shifts."]
      - ["What did she say?", "She can't drive me anywhere on Tuesdays or Thursdays. So that's the end of the centre, isn't it."]
    caregiver:
      - ["Hi Tessa. How's the weekend been?", "Fine. I need to put something right, though."]
      - ["Go ahead.", "I told the social worker in May I could drive Mum on any weekday, and I told you most days. That's wrong. I work long shifts on Tuesdays and Thursdays and I take the car. I can't drive her on Tuesdays or Thursdays."]
      - ["What does that mean for Oakfield?", "Oakfield only has places on Tuesdays and Thursdays. So I can't get her there, even if she wanted to go."]
  - day: 8
    patient:
      - ["Hello Win. How was your walk?", "Lovely. I took my phone like I said."]
      - ["Have you thought more about the day centre or the walking group?", "I'll keep my own walks every morning. I might try Joyce's Wednesday walk if she calls for me. I'm not going to the centre."]
    caregiver:
      - ["Hi Tessa. Any news on Oakfield?", "No. I haven't rung them. As far as I know they're still holding the Tuesday and Thursday place."]
      - ["How was her walk today?", "Forty minutes, back on time. She had her phone in her pocket."]
  - day: 9
    patient:
      - ["Good morning, Win. Did you get out?", "Yes, round by the church. Short and sweet."]
      - ["Did you have your phone with you?", "I think so. It's in my coat somewhere."]
    caregiver:
      - ["Hi Tessa. How was today?", "I was at work. I rang her at lunch and it went straight to voicemail. The phone was flat when I got home."]
      - ["Did you reach her in the end?", "Yes, on the house phone about half one. She'd been back from her walk for ages and was fine."]
  - day: 10
    patient:
      - ["Hello Win. How was your morning?", "Quiet. Joyce and I were going to try her walking group, but she had a hospital appointment, so we didn't go. Maybe next week."]
      - ["What would you like the doctor to know?", "That I want to keep my walks. I don't want the centre. I'll try the walking group with Joyce, but nobody needs to book me into anything."]
      - ["Anything else?", "No, dear."]
    caregiver:
      - ["Hi Tessa. What would you like the doctor to know before the social work review?", "That Mum won't go to Oakfield, and I can't drive her on the days they have. I'd like the doctor's view on whether her walks on her own are still sensible."]
      - ["What has been arranged so far?", "Nothing. I haven't rung Oakfield or the social worker. She hasn't been to the walking group yet, Joyce couldn't go today."]
      - ["Is there anything you could offer on other days?", "I'm off on Mondays, Wednesdays and Fridays. I don't know whether Oakfield has a place on any of those days, and Mum would still say no."]
      - ["I'll pass that on. Could you keep her phone charged and let us know if a walk runs much longer than usual?", "Yes, I'll charge it each night. I can't promise she'll take it every time."]
