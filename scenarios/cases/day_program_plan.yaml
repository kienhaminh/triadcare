    title: Memory clinic follow-up note
    date: "2026-03-24"
    author: Memory clinic
    text: >-
      Winifred attended with her daughter Tessa. She walks alone most mornings on a familiar route
      around the local park, about 40 minutes, and values this. No falls in the last year and no
      episodes of getting lost reported by her daughter. Discussed social contact and structured
      activity; she was not keen on a day centre. Plan: continue donepezil 10 mg; refer to community
      social work for a support plan; memory clinic review in six months.
  - type: Encounter
    id: encounter-social-work-visit
    kind: Community social work home visit
    status: finished
    date: "2026-05-12"
    reason: Support planning after memory clinic referral
  - type: DocumentReference
    id: document-social-work-note
    title: Social work home visit note
    date: "2026-05-12"
    author: Community social worker
    text: >-
      Home visit with Winifred and her daughter Tessa, who lives with her and is her main carer.
      Tessa said she can drive her mother to a day centre on any weekday. Oakfield day centre has
      places on Tuesdays and Thursdays only, and its minibus does not cover their road. Winifred said
      she would rather keep her morning walks and was unsure about the centre. Tessa asked for a
      place to be held. Referral sent to Oakfield for Tuesdays and Thursdays; start date not set.
      Plan: phone review on 2026-07-15.
