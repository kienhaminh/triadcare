  - id: ehr-egfr
    content: The most recent eGFR is 52 mL/min/1.73 m2 on 2026-05-05, similar to 55 a year earlier.
    anchors:
      - source: Observation/observation-egfr
        quote: 52 mL/min/1.73 m2
    reporter: FHIR record
    event_time: "2026-05-05"
    reported_at: "2026-07-06"
    uncertainty: One recent result; eGFR is not the estimated creatinine clearance used in memantine dosing, and no later result is recorded.
    priority: supporting
    must_state: ["the last eGFR is 52, from May 2026"]
  - id: ehr-organizer-note
    content: The memory clinic note of 2026-05-12 records that Rosemary lives alone, that Lorna fills a weekly organizer on Sunday evenings and phones each morning to prompt, and that Rosemary preferred to keep the organizer when pharmacy-filled blister packs were discussed.
    anchors:
      - source: DocumentReference/note-memory-review
        quote: fills a weekly pill organizer on Sunday evenings and phones each morning at about nine to prompt the morning tablets
      - source: DocumentReference/note-memory-review
        quote: Pharmacy-filled blister packs were discussed; Rosemary prefers to keep the organizer.
    reporter: FHIR record
    event_time: "2026-05-12"
    reported_at: "2026-07-06"
    uncertainty: Clinic note; it describes the plan, not what happens each day.
    priority: supporting
    must_state: ["Lorna fills a weekly organizer and phones each morning; pharmacy blister packs were discussed in May, but Rosemary preferred to keep her organizer"]
  - id: spill-dose-unknown
    content: On Tuesday 2026-07-07 Rosemary spilled water over the organizer. That day she said she took the wet tablets, she thinks; the next day she said she threw them in the bin. Lorna found the Tuesday morning compartment open and damp with crumbled white tablet in the corner, saw no tablets in the bin, gave nothing extra, and reports that the pharmacy advised not to double up.
    anchors:
      - source: day-2:patient
        quote: I took my tablets, I think. They were a bit wet.
      - source: day-2:caregiver
        quote: the Tuesday morning lid was open, the compartment was damp, and there was a bit of crumbled white tablet stuck in the corner.
      - source: day-3:patient
        quote: Oh, I didn't take those. They were soggy, so I threw them in the bin.
      - source: day-3:caregiver
        quote: I looked in the kitchen bin tonight and didn't see any tablets.
    reporter: patient and caregiver
    event_time: Morning of 2026-07-07
    reported_at: "2026-07-08"
    uncertainty: Rosemary gave two different accounts; Lorna cannot tell which tablet the fragment was or whether any dose was swallowed.
    priority: essential
    essential_limit: true
    must_state: ["after the water spill, whether Rosemary took the Tuesday morning tablets is unknown"]
  - id: double-open
    content: Lorna reported on 2026-07-11 that on Thursday evening, 2026-07-09, both the Thursday and the Friday morning compartments were open and empty. She does not know whether Rosemary took both days' tablets or dropped some. On Friday Rosemary said she had taken her morning tablets as usual, and Lorna does not know where they came from.
    anchors:
      - source: day-6:caregiver
        quote: When I got there that night, Friday's morning lid was open as well as Thursday's, and both were empty.
      - source: day-6:caregiver
        quote: She might have taken both lots on Thursday morning, or dropped some.
      - source: day-6:caregiver
        quote: Then on Friday she told me on the phone she'd had her tablets, and I don't know where they came from.
      - source: day-5:patient
        quote: Yes, as usual. I always do.
    reporter: caregiver and patient
    event_time: Compartments found empty on the evening of 2026-07-09; Friday dose on 2026-07-10
    reported_at: "2026-07-11"
    uncertainty: Reported two days after the event; nobody saw what Rosemary took, and empty compartments do not show that tablets were swallowed.
    priority: essential
    essential_limit: true
    must_state: ["on Thursday evening both the Thursday and Friday morning compartments were open and empty", "whether she took two days of tablets, and where Friday's dose came from, is unknown"]
  - id: patient-denies-double
    content: On 2026-07-11 Rosemary said she would never take two lots and is careful with her tablets; this does not establish what she took on 2026-07-09. On Friday morning she said she had taken her tablets as usual.
    anchors:
      - source: day-6:patient
        quote: I'd never take two lots. I'm careful with my tablets.
      - source: day-5:patient
        quote: Yes, as usual. I always do.
    reporter: patient
    event_time: 2026-07-10 to 2026-07-11
    reported_at: "2026-07-11"
    uncertainty: Patient recall; it differs from the organizer state that Lorna reports and is not confirmed.
    priority: supporting
    must_state: ["Rosemary says she would never take two lots"]
  - id: old-box-found
    content: On 2026-07-09 Lorna found the old memantine 10 mg box in the kitchen drawer; she thought she had returned it in May. Rosemary calls the tablets her spares. Lorna thought the box looked full and left it there that night.
    anchors:
      - source: day-4:caregiver
        quote: I found her old memantine box in the kitchen drawer, the 10 milligram ones from before they changed it. I thought I'd taken that back to the chemist in May.
      - source: day-4:caregiver
        quote: It looks full to me.
      - source: day-4:caregiver
        quote: She said they're her spares, in case she runs out.
    reporter: caregiver
    event_time: "2026-07-09"
    reported_at: "2026-07-09"
    uncertainty: Lorna did not count the tablets that day; on 2026-07-12 she found four empty blisters.
    priority: essential
    must_state: ["a stopped supply of memantine 10 mg tablets was in her kitchen drawer"]
  - id: old-box-count
    content: On 2026-07-12 Lorna took the old memantine 10 mg box home and found that it is not full; one strip has four empty blisters. She does not know whether they were used before the May change or during this week.
    anchors:
      - source: day-7:caregiver
        quote: I've taken it home with me. I said it looked full, but it isn't. One strip has four empty blisters.
      - source: day-7:caregiver
        quote: They could be from before the change in May, or this week. I never counted them.
    reporter: caregiver
    event_time: Counted 2026-07-12; time of use unknown
    reported_at: "2026-07-12"
    uncertainty: No earlier count exists, so the four empty blisters do not show when any tablet was taken.
    priority: essential
    essential_limit: true
    correction_of: [old-box-found]
    must_state: ["the old box has four empty blisters, and when they were used is unknown"]
  - id: drowsy-friday
    content: On Friday 2026-07-10 Rosemary felt dizzy on standing in the morning. At about 17:30 Lorna found her asleep in the chair and more muddled than usual on waking; she did not know it was Friday. No fall is known. She was awake, talking and ate her tea, but seemed slow, and Lorna stayed overnight. Lorna reports that she called NHS 111, who advised watching her at home and getting her seen if she got worse; nobody examined her.
    anchors:
      - source: day-5:patient
        quote: I've a funny head. Swimmy, when I stand up.
      - source: day-5:caregiver
        quote: When I got there at half five she was asleep in the chair, and she was more muddled than usual when she woke up.
      - source: day-5:caregiver
        quote: No fall that I know of.
      - source: day-5:caregiver
        quote: She's awake and talking, she ate her tea. She seems a bit slow.
      - source: day-6:caregiver
        quote: They went through a lot of questions and said she could stay home with me watching her, and to ring back or get her seen if she got worse. Nobody came out to examine her.
    reporter: patient and caregiver
    event_time: "2026-07-10"
    reported_at: "2026-07-11"
    uncertainty: Telephone triage only; no blood pressure, pulse, or examination. The cause is not established.
    priority: essential
    must_state: ["on Friday she was dizzy on standing, then found asleep and more muddled than usual"]
  - id: symptoms-settled
    content: Rosemary was brighter on 2026-07-11 with slight dizziness first thing, had no dizziness and was steady on 2026-07-12, had a mild headache on the evening of 2026-07-13, and Lorna reports no dizziness since the weekend.
    anchors:
      - source: day-6:caregiver
        quote: Brighter than yesterday.
      - source: day-7:caregiver
        quote: No dizziness today and she was steady on her feet.
      - source: day-9:patient
        quote: I had a bit of a headache yesterday evening. Gone now.
      - source: day-10:caregiver
        quote: Fine. Bright, steady, no dizziness since the weekend.
    reporter: patient and caregiver
    event_time: 2026-07-11 to 2026-07-15
    reported_at: "2026-07-15"
    uncertainty: Patient and caregiver report; no examination or vital signs.
    priority: supporting
    must_state: ["dizziness was milder on Saturday and absent on Sunday, with no further dizziness reported since", "a mild headache on Monday evening has gone"]
  - id: new-routine
    content: From 2026-07-13 Lorna video calls at nine and watches Rosemary open the right compartment and take the morning tablets.
    anchors:
      - source: day-8:caregiver
        quote: I've started video calling her at nine so I can see her open the right lid and take them.
      - source: day-9:caregiver
        quote: Video call again, she took Tuesday's while I watched.
    reporter: caregiver
    event_time: From 2026-07-13
    reported_at: "2026-07-14"
    uncertainty: Covers the morning dose only; the evening donepezil dose is not watched.
    priority: supporting
    must_state: ["Lorna now watches the morning dose on a video call"]
  - id: pharmacist-callback
    content: Lorna left a message for the practice pharmacist on 2026-07-13. She reports that the pharmacist rang back on 2026-07-14 and advised the usual dose, nothing extra to make up, and return of the old tablets to the pharmacy, and mentioned pharmacy blister packs. Nothing is decided, and the old box is still in Lorna's car.
    anchors:
      - source: day-8:caregiver
        quote: I rang the surgery and left a message for the practice pharmacist.
      - source: day-9:caregiver
        quote: She said keep to the usual dose, don't give anything extra to make up, and take the old tablets back to the chemist.
      - source: day-9:caregiver
        quote: Nothing yet. Mum has to agree. And the old box is still in my car, I haven't taken it back yet.
      - source: day-10:caregiver
        quote: The old box is still in my car.
    reporter: caregiver
    event_time: 2026-07-13 to 2026-07-15
    reported_at: "2026-07-15"
    uncertainty: Lorna's report of the pharmacist call; no pharmacist note is in the record.
    priority: essential
    essential_limit: true
    must_state: ["Lorna reports the pharmacist advised the usual dose with nothing extra", "the old box has not been returned and nothing is arranged"]
  - id: patient-declines-dispenser
    content: Rosemary says she can manage her own tablets and refuses a bleeping or locked dispenser. She accepts Lorna's calls, is undecided about pharmacy blister packs, and wants her spare tablets back.
    anchors:
      - source: day-10:patient
        quote: I can manage my own tablets. I don't want a machine bleeping at me or locked boxes.
      - source: day-10:patient
        quote: Lorna ringing is all right. I don't know about these packs. I'll think about it.
      - source: day-9:patient
