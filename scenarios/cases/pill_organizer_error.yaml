schema: scenario_v4
id: pill_organizer_error
split: held_out
title: Weekly pill organizer errors and an old memantine supply at home
summary: >
  Rosemary lives alone. Her daughter Lorna fills a weekly pill organizer and phones each morning.
  In May the memantine prescription changed from two 10 mg tablets to one 20 mg tablet, and the
  old 10 mg box was to go back to the pharmacy. Over the week Rosemary spills water over the
  organizer and gives two accounts of that dose. Lorna finds the old memantine box in a drawer and
  later reports, two days late, that two morning compartments were empty on one evening. Rosemary
  is dizzy and muddled the next day, then settles. A practice pharmacist advises the usual dose.
  The old box is not yet returned, and Rosemary refuses a locked or alarmed dispenser.
start_date: "2026-07-06"
patient:
  id: P-206
  name: Rosemary
  gender: female
  birth_year: 1945
  persona: Mild to moderate Alzheimer dementia. Retired school secretary. Lives alone in a bungalow. Proud of managing her own tablets. Cheerful, sometimes gives different accounts of the same morning.
caregiver:
  name: Lorna
  relation: daughter
  persona: Lives ten minutes away and works in a school office. Phones her mother at nine each morning and calls in after work at about half five. Fills the organizer on Sunday evenings.
baseline:
  date: "2026-05-12"
  diagnosis: Dementia due to Alzheimer disease, mild to moderate stage
  mmse: 17
  moca: 11
  cdr_global: 1
  cdr_sb: 7
  faq: 18
record:
  - type: Condition
    id: condition-hypertension
    code: Essential hypertension
    status: active
    date: "2016-09-02"
  - type: MedicationRequest
    id: med-donepezil
    medication: Donepezil 10 mg tablet
    dosage: 10 mg by mouth once daily at bedtime
    status: active
    date: "2024-12-03"
    note: Started at 5 mg in November 2024 and increased to 10 mg on 2024-12-03.
  - type: MedicationRequest
    id: med-memantine-10
    medication: Memantine 10 mg tablet
    dosage: 20 mg (two 10 mg tablets) by mouth once daily in the morning
    status: stopped
    status_reason: Stopped on 2026-05-12 and replaced by one 20 mg tablet once daily; remaining 10 mg tablets to be returned to the pharmacy
    date: "2025-11-18"
    note: Prescribed on 2025-11-18 after memantine was added to donepezil in October 2025 and titrated weekly from 5 mg to 20 mg daily. Stopped on 2026-05-12, when the 20 mg tablet order replaced it.
  - type: MedicationRequest
    id: med-memantine-20
    medication: Memantine 20 mg tablet
    dosage: 20 mg by mouth once daily in the morning
    status: active
    date: "2026-05-12"
    note: Replaces two 10 mg tablets so the organizer holds one memantine tablet.
  - type: MedicationRequest
    id: med-amlodipine
    medication: Amlodipine 5 mg tablet
    dosage: 5 mg by mouth once daily in the morning
    status: active
    date: "2019-03-21"
  - type: Observation
    id: observation-egfr
    category: laboratory
    code: Estimated glomerular filtration rate (CKD-EPI)
    date: "2026-05-05"
    value: 52 mL/min/1.73 m2
    note: Similar to 55 mL/min/1.73 m2 in April 2025.
  - type: Observation
    id: observation-bp
    category: vital-signs
    code: Blood pressure, seated
    date: "2026-05-12"
    value: 134/78 mmHg
  - type: Observation
    id: observation-pulse
    category: vital-signs
    code: Pulse rate
    date: "2026-05-12"
    value: 68 per minute, regular
  - type: Encounter
    id: encounter-memory-review
    kind: Memory clinic follow-up
    status: finished
    date: "2026-05-12"
    reason: Review of Alzheimer dementia and medicines
  - type: DocumentReference
    id: note-memory-review
    title: Memory clinic follow-up note
    date: "2026-05-12"
    author: Memory clinic
    text: >-
      Reviewed with daughter Lorna. MMSE 17 today, from 19 in November 2025. Lives alone. Lorna lives
      nearby, fills a weekly pill organizer on Sunday evenings and phones each morning at about nine to
      prompt the morning tablets. Memantine tolerated with no dizziness reported. Changed from two 10 mg
      tablets to one 20 mg tablet each morning so the organizer holds one memantine tablet; the remaining
      10 mg tablets are to be returned to the pharmacy. Donepezil 10 mg at night continues. Pharmacy-filled
      blister packs were discussed; Rosemary prefers to keep the organizer. Plan: GP medication review in
      July; memory clinic review in six months.
  - type: DocumentReference
    id: document-medication-support-note
    title: Home medication support note
    date: "2026-05-12"
    author: Memory clinic nurse
    text: Home medication support note. Daughter Lorna fills a weekly organizer with morning and evening compartments each Sunday and phones at about 09:00 to prompt the morning tablets. Morning compartment holds memantine 20 mg and amlodipine 5 mg; evening compartment holds donepezil 10 mg. No entries since 2026-05-12.
  - type: Encounter
    id: encounter-medication-review
    kind: Primary care medication review
    status: planned
    date: "2026-07-16"
    reason: Review of medicines and home medication support
imaging:
  - study_id: CASE-P206-MRI
    modality: mri
    date: "2025-02-18"
    description: Brain MRI without contrast for assessment of memory decline
    source_series: DLBS-3319-W1-T1W
days:
  - day: 1
    patient:
      - ["Good morning, Rosemary. How are you today?", "Not bad. Lorna rang already, she always does."]
      - ["Have you had your morning tablets?", "Yes, while she was on the phone. Monday's little box."]
      - ["What are you doing today?", "The library van comes on Mondays. I like the big print ones."]
    caregiver:
      - ["Hi Lorna. How has your mum been?", "Fine. I rang at nine as usual and she said she'd had them."]
      - ["Did you check the organizer?", "When I went round after work the Monday morning compartment was empty and the lid was shut. The evening one was still full, which is right."]
      - ["Anything else?", "No, a normal day."]
  - day: 2
    patient:
      - ["Good morning, Rosemary. How has your morning been?", "Clumsy. I knocked my glass of water over on the counter, right by the pill box."]
      - ["What happened to your tablets?", "I mopped it up with the tea towel. I took my tablets, I think. They were a bit wet."]
      - ["Are you all right in yourself?", "Yes, only cross with myself."]
    caregiver:
      - ["Hi Lorna. How was today?", "Mum spilt water over the pill box this morning. When I got there tonight the Tuesday morning lid was open, the compartment was damp, and there was a bit of crumbled white tablet stuck in the corner. The other lids were shut and dry."]
      - ["Could you tell which tablet it was?", "No. Once they're soggy I can't tell one from the other, or whether she swallowed them or they just went to mush."]
      - ["What did you do?", "I didn't give her anything extra. I rang the chemist and they said not to double up, just carry on with the next dose."]
  - day: 3
    patient:
      - ["Hello Rosemary. You mentioned the spilt water. Did you take your morning tablets yesterday?", "Oh, I didn't take those. They were soggy, so I threw them in the bin."]
      - ["Yesterday you thought you had taken them. Which is right?", "Did I say that? Well, I'm not sure now. One or the other."]
      - ["How are you today?", "Fine. Bit tired."]
    caregiver:
      - ["Hi Lorna. Rosemary says she put the wet tablets in the bin. Did you see any?", "I looked in the kitchen bin tonight and didn't see any tablets. That doesn't prove much, it was full of tea bags."]
      - ["How has she been otherwise?", "Same as usual. Wednesday's morning one was empty and shut when I got there."]
  - day: 4
    patient:
      - ["Good morning, Rosemary. How are you?", "Very well. Lorna's coming tonight."]
      - ["Have you had your tablets this morning?", "Yes, all done."]
    caregiver:
      - ["Hi Lorna. How was your visit?", "I found her old memantine box in the kitchen drawer, the 10 milligram ones from before they changed it. I thought I'd taken that back to the chemist in May."]
      - ["Has any of it been used?", "It looks full to me. I don't think she's touched it."]
      - ["What did Rosemary say about it?", "She said they're her spares, in case she runs out. I left it there for now, she got upset when I picked it up."]
  - day: 5
    patient:
      - ["Good morning, Rosemary. How are you this morning?", "I've a funny head. Swimmy, when I stand up."]
      - ["Have you taken your morning tablets?", "Yes, as usual. I always do."]
      - ["Please sit for a moment before you stand, and ring Lorna if it gets worse. Is anyone with you?", "No, I'm on my own. I'll sit in my chair."]
    caregiver:
      - ["Hi Lorna. How was your mum today?", "Not great. When I got there at half five she was asleep in the chair, and she was more muddled than usual when she woke up. She didn't know it was Friday."]
      - ["Did she fall or hurt herself?", "No fall that I know of. She said she'd been dizzy this morning."]
      - ["How is she now?", "She's awake and talking, she ate her tea. She seems a bit slow. I'm staying tonight."]
      - ["New confusion and sleepiness that came on today need an urgent check tonight. Please call 111 now, or 999 if she is hard to wake, collapses, or gets more confused. Can you do that?", "Yes, I'll ring 111 now. I'm staying with her."]
  - day: 6
    patient:
      - ["Hello Rosemary. How do you feel today?", "Better. Lorna stayed over, she fusses."]
      - ["What did she fuss about?", "My tablets on Thursday. I'd never take two lots. I'm careful with my tablets."]
      - ["How is the dizziness?", "A bit, first thing. Not like yesterday."]
    caregiver:
      - ["Hi Lorna. How is she today?", "Brighter than yesterday. She's eaten breakfast and she's chatting."]
      - ["Did you speak to 111 last night?", "Yes. They went through a lot of questions and said she could stay home with me watching her, and to ring back or get her seen if she got worse. Nobody came out to examine her."]
      - ["Anything else to report?", "Something I should have said on Thursday. When I got there that night, Friday's morning lid was open as well as Thursday's, and both were empty. I was in a flap about the old box and it went out of my head."]
      - ["Do you know whether she took both?", "No. She might have taken both lots on Thursday morning, or dropped some. Then on Friday she told me on the phone she'd had her tablets, and I don't know where they came from."]
  - day: 7
    patient:
      - ["Good morning, Rosemary. How are you?", "Fine, dear. No swimmy head today."]
      - ["What have you been doing?", "Lorna did my pill box. And she took my spare tablets away. I wasn't pleased."]
    caregiver:
      - ["Hi Lorna. How did today go?", "Better. No dizziness today and she was steady on her feet. I filled the organizer for the week."]
      - ["What happened with the old box?", "I've taken it home with me. I said it looked full, but it isn't. One strip has four empty blisters."]
      - ["Do you know when those were used?", "No idea. They could be from before the change in May, or this week. I never counted them."]
  - day: 8
    patient:
      - ["Good morning, Rosemary. How are you?", "Fine. Lorna watched me take my tablets on the phone with the picture."]
      - ["How did that go?", "It's a palaver. But it's all right."]
    caregiver:
      - ["Hi Lorna. Anything new?", "I've started video calling her at nine so I can see her open the right lid and take them. Today she did Monday's and swallowed both."]
      - ["Have you talked to anyone about what happened last week?", "I rang the surgery and left a message for the practice pharmacist. Nobody has called back yet."]
      - ["How has she been?", "Fine today. Steady and bright."]
  - day: 9
    patient:
      - ["Hello Rosemary. How are you?", "I had a bit of a headache yesterday evening. Gone now."]
      - ["Anything else?", "No. I'd like my spare tablets back."]
    caregiver:
      - ["Hi Lorna. How was today?", "Good. Video call again, she took Tuesday's while I watched."]
      - ["Did the pharmacist ring back?", "Yes, this afternoon. She said keep to the usual dose, don't give anything extra to make up, and take the old tablets back to the chemist. She said the chemist could do blister packs instead of the organizer."]
      - ["What did you decide?", "Nothing yet. Mum has to agree. And the old box is still in my car, I haven't taken it back yet."]
  - day: 10
    patient:
      - ["Good morning, Rosemary. The doctor is reviewing your tablets tomorrow. Is there anything you would like them to know?", "I can manage my own tablets. I don't want a machine bleeping at me or locked boxes."]
      - ["Would chemist blister packs or Lorna's calls suit you better?", "Lorna ringing is all right. I don't know about these packs. I'll think about it."]
      - ["Anything else for the doctor?", "Only that I want my spares back."]
    caregiver:
      - ["Hi Lorna. What would you like the doctor to know?", "I want to know if last week did her any harm, and whether we should change how she gets her tablets."]
      - ["What do you know now about the doses last week?", "I still don't know what she took on the Tuesday after the spill, or on Thursday and Friday. I only know what I found in the box."]
      - ["Have you arranged anything yet?", "No. I've read about the dispensers that lock and beep, but she said no. The old box is still in my car."]
      - ["How is she today?", "Fine. Bright, steady, no dizziness since the weekend."]
