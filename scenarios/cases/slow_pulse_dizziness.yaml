    reporter: caregiver
    event_time: Dose left out on the morning of 2026-07-11; given again on 2026-07-12
    reported_at: "2026-07-15"
    priority: supporting
    must_state: ["Pauline left out one morning bisoprolol dose on her own, then restarted it after a pharmacist's advice"]
