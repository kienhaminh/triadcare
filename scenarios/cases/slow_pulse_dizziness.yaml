days:
  - day: 1
    patient:
      - ["Good morning, Desmond. How are you today?", "Not bad. The racing's on later."]
      - ["How have you been feeling in yourself?", "Fine. A bit stiff in the mornings, that's all."]
      - ["Have you been out in the garden?", "Every day if it's dry. The beans need watching."]
    caregiver:
      - ["Hi Pauline. How has Desmond been?", "He's all right mostly. The last couple of weeks he's gone a bit light-headed when he gets up out of his chair. He has to sit straight back down."]
      - ["Has he fallen or blacked out at all?", "No, nothing like that. He just waits a minute and then he's off again."]
      - ["How are his tablets going?", "I do his pill box on a Sunday, same as always. Heart tablet and aspirin in the morning, memory tablet and cholesterol one at night."]
      - ["His clinic asked for any dizziness to be reported to his GP. Please ring the surgery today and tell them about the light-headedness. If he faints, has chest pain or is breathless, call 999. Can you ring today?", "I'll mention it when I next ring about his prescription."]
  - day: 2
    patient:
      - ["Hello Desmond. How did yesterday go?", "I had a funny do in the garden yesterday afternoon. Everything went grey and I hung on to the fence till it passed."]
      - ["Did you fall or hurt yourself?", "No, no. I stood still and it went off. I didn't say anything to Pauline, she worries."]
      - ["How do you feel now?", "Right as rain."]
    caregiver:
      - ["Hi Pauline. How was Desmond yesterday?", "Quiet. He was out with his beans most of the afternoon while I went to the shops."]
      - ["Did he mention feeling unwell in the garden?", "He never said a word to me about that. He was sat with a cup of tea when I got back."]
      - ["Is he eating and drinking all right?", "Yes, he's a good eater. He doesn't drink much in the day, but he never has."]
      - ["Have you reached the surgery about the light-headedness?", "Not yet. I thought I'd leave it till the prescription's due."]
      - ["Dizziness on standing, and any grey or faint spells, need GP advice today, as his clinic asked. If the surgery cannot help today, call 111. Call 999 if he faints, has chest pain or is breathless.", "All right. I'll ring them tomorrow morning, I've got the shopping to do today."]
  - day: 3
    patient:
      - ["Good morning, Desmond. How are you feeling?", "Champion. Pauline had that cuff on me last night, squeezing my arm."]
      - ["Did you feel dizzy at all yesterday?", "A bit woozy when I came in. It passed."]
    caregiver:
      - ["Hi Pauline. Anything new with Desmond?", "I got my blood pressure machine out last night. He came in from the garden and said he felt woozy, so I did him."]
      - ["What did it show?", "The pulse said thirty-eight. I had to squint at it. This morning it was fifty-two and his blood pressure was all right."]
      - ["Is he dizzy, faint, short of breath or in pain now?", "No. He's sat doing the crossword. He says I'm making a fuss."]
      - ["A pulse below 50 with dizziness needs a GP assessment today, with a pulse check and an ECG. Tell them the pulse readings as well as the dizziness. If the surgery cannot see him today, call 111. Call 999 if he faints, has chest pain or is breathless. Can you ring now?", "I'll ring them after lunch when the lines are quieter."]
  - day: 4
    patient:
      - ["Hello Desmond. How are you today?", "Fine. Why does everybody keep asking?"]
      - ["Any dizziness this morning?", "No. Well, a touch when I got up. Nothing to write home about."]
    caregiver:
      - ["Hi Pauline. Did you reach the surgery yesterday?", "I did. The receptionist gave him a telephone appointment with the GP for next Monday."]
      - ["Did you tell them about the pulse readings?", "I said about the dizziness. I don't think I mentioned the pulse, it went out of my head."]
      - ["A telephone call on Monday is too long to wait with a slow pulse and dizziness. Please ring back now, tell them about the pulse of thirty-eight, and ask for him to be seen today. If they cannot see him today, call 111. Call 999 if he faints, has chest pain or is breathless.", "I'll ring back if he gets any worse. I don't like to keep bothering them."]
  - day: 5
    patient:
      - ["Good morning, Desmond. How are you?", "I'm all right. I came over a bit queer at the sink, that's all."]
      - ["Do you remember what happened?", "Not really. I was rinsing the cups and then Pauline was holding on to me. I don't remember going down."]
      - ["Do you have any pain anywhere?", "No. My head's fine. Stop fussing."]
    caregiver:
      - ["Hi Pauline. How is Desmond this morning?", "He gave me a fright. After breakfast he was at the sink and his legs just went. I caught him and got him down on to the floor."]
      - ["What happened next?", "He went a horrible grey colour and he didn't answer me for a few seconds. Then he came round and asked what all the fuss was about."]
      - ["Did he hit his head?", "I don't think so. I had hold of him the whole way down."]
      - ["Did you check his pulse afterwards?", "I did it when he was back in his chair. The machine said forty-six."]
      - ["Is he faint, confused, short of breath or in pain now?", "He's sat in his chair talking to me. He says he has no chest pain. I haven't rung anyone yet."]
      - ["He may have blacked out for a few seconds, and his pulse was slow. He needs to be seen face to face today, with an ECG. Call 999 now if he is not fully back to normal, or if he collapses again, has chest pain, is breathless or has hurt his head. Otherwise ring the surgery now and say he may have blacked out. If they cannot see him today, call 111. Do not change or leave out any tablets yourself.", "I'll ring the surgery now. He's cross with me for making a fuss."]
  - day: 6
    patient:
      - ["Hello Desmond. How are you feeling today?", "Fine. Pauline's been fiddling with my pills."]
      - ["What would you like the doctor to know?", "Don't let them take my memory pill off me. It keeps me sharp."]
    caregiver:
      - ["Hi Pauline. What happened after yesterday's spell?", "The surgery had nothing left, so I rang 111 in the evening. A doctor rang back about nine o'clock."]
      - ["What did the doctor advise?", "He asked lots of questions. I told him it was a dizzy turn and he was right again now. He said to see our own GP on Monday for a heart tracing, and to ring 999 if he passes out again."]
      - ["A Monday ECG does not replace an urgent check. He may have blacked out yesterday and his pulse was slow, so he still needs to be seen face to face today. Please call 111 again and tell them about the blackout, the pulse readings and his heart block. Call 999 if he collapses, does not come round quickly, has chest pain or is breathless.", "I'll ring 111 again after lunch. He says he feels fine."]
      - ["How are his tablets this morning?", "I didn't give him his heart tablet this morning. With his pulse being low I thought it was safer to leave it out."]
      - ["Please don't stop or leave out his tablets without speaking to a clinician. Some heart tablets should not be stopped suddenly. Can you ask a pharmacist or 111 today about this morning's dose?", "I'll ask the chemist when I'm in tomorrow."]
  - day: 7
    patient:
      - ["Good morning, Desmond. How are you today?", "Not bad. Liam's coming for his dinner."]
      - ["Any dizzy spells since yesterday?", "Not that I know of."]
    caregiver:
      - ["Hi Pauline. Did you speak to anyone about his heart tablet?", "I rang the chemist this morning. She said not to stop it without asking the doctor, so he's had it again today."]
      - ["Has anything else changed?", "I got that pulse wrong. Our grandson Liam looked through the machine's memory last night. The one I told you was thirty-eight was forty-eight. I didn't have my glasses on."]
      - ["What other readings did he find?", "Fifty-two on Wednesday morning, forty-six after the sink on Friday, and fifty-six yesterday."]
      - ["Has he been dizzy today?", "Not today. He's been pottering about."]
  - day: 8
    patient:
      - ["Hello Desmond. How are you today?", "Fine. The doctor rang Pauline, not me."]
      - ["How are you feeling in yourself?", "Same as ever."]
    caregiver:
      - ["Hi Pauline. Did the GP ring this morning?", "She did. She's booked him in on Thursday afternoon at the surgery, with a heart tracing first."]
      - ["Did she say anything about his tablets?", "She said to keep giving them all as normal until she's seen him."]
      - ["Did you tell her about the faint on Friday and the pulse readings?", "I read out all his pulse readings this time. I said he had a dizzy turn at the sink, but I didn't say he went quiet on me."]
      - ["Thursday may be too late after a possible blackout and slow pulse readings. Please ask the GP today whether he should be seen and have the ECG sooner. If he has another spell, he needs to be seen the same day; call 111 if the surgery cannot see him. Call 999 if he collapses, does not come round quickly, has chest pain or is breathless.", "I'll ask the surgery. I've written it on the calendar."]
  - day: 9
    patient:
      - ["Good morning, Desmond. How are you?", "Bit wobbly first thing. I'm fine now."]
      - ["What happened?", "I don't know. I got up and my legs went soft, so I sat down again."]
    caregiver:
      - ["Hi Pauline. How was Desmond this morning?", "He had another dizzy turn getting up off the toilet. He grabbed the rail and sat back down. He didn't go down."]
      - ["Did you check his pulse?", "I did it after. It said forty-four, but he kept moving his arm and the cuff had slipped down, so I don't trust it."]
      - ["Is he faint, confused, short of breath or in pain now?", "No. He's eating his breakfast and grumbling about me."]
      - ["Another spell means he needs to be seen face to face today, not on Thursday. Ring the surgery now and ask for a same-day check with an ECG. If they cannot see him today, call 111. Call 999 if he collapses, does not come round quickly, has chest pain or is breathless.", "I'll ring the surgery when they open."]
  - day: 10
    patient:
      - ["Hello Desmond. How are you feeling today?", "Pauline says I'm seeing the doctor tomorrow. I don't know what for, I'm right as rain."]
      - ["Is there anything you want to ask the doctor?", "Just leave my memory pill alone."]
    caregiver:
      - ["Hi Pauline. Did you reach the surgery yesterday?", "I rang. The duty doctor rang me back in the afternoon and said to keep Thursday's appointment and to ring 999 if he faints."]
      - ["Has anyone checked his heart or done a tracing yet?", "No. Nobody's done his heart tracing yet. That's tomorrow."]
      - ["How are his tablets?", "I haven't touched his tablets since Sunday. He's having them all as normal."]
      - ["Is he dizzy, faint or unwell right now?", "No, he's sat watching the racing."]
      - ["What would you like the doctor to know?", "Is it his memory tablet doing this? My sister read that it can slow the heart."]
      - ["I will pass that on. After a possible blackout and another spell, he still needs an urgent heart check, not a routine one. Please ring the surgery or 111 now and tell them about the blackout and his heart block, and ask whether he should be seen today rather than tomorrow. Do not change his tablets yourself. Call 999 if he collapses, does not come round quickly, has chest pain or is breathless.", "I will. I've got all his readings written down for them."]
