  - id: bathroom-spell
    content: On the morning of 2026-07-14 Desmond had another dizzy spell getting up from the toilet; he held the rail, sat down and did not fall. Pauline's monitor then read a pulse of 44, but she does not trust it because he moved his arm and the cuff slipped.
    anchors:
