schema: scenario_v4
id: slow_pulse_dizziness
split: held_out
title: Dizzy spells and a slow home pulse on donepezil and bisoprolol
summary: >
  Desmond takes donepezil 10 mg at night and bisoprolol 5 mg each morning for angina. His March
  ECG showed sinus bradycardia with first-degree heart block, and the clinic asked his wife to report
  dizziness, fainting or a pulse below 50. Over the week he has light-headed spells and a grey-out in
  the garden that he does not tell Pauline about. Her own home blood pressure monitor shows a pulse
  she first reports as 38; her grandson later finds it was 48 in the monitor memory. On Friday he
  collapses at the kitchen sink and does not answer her for a few seconds, a possible brief loss of
  consciousness. She is advised to seek immediate assessment. An out-of-hours doctor advises a GP visit
  for an ECG on Monday, and the care team says this does not replace urgent assessment. Pauline leaves out
  one bisoprolol dose on her own, then gives it again after a pharmacist's advice. A further spell
  follows with an unreliable reading of 44. She reports a GP appointment with an ECG for Thursday,
  which is not in the record. No new ECG or examination has happened by the last check-in.
