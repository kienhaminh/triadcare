  - id: ecg-booked-thursday
    content: Pauline reports that the GP booked Desmond for Thursday afternoon at the surgery with an ECG first, and said to keep giving all tablets as normal. After the next spell the duty doctor said to keep that appointment. On 2026-07-15 nobody has done the ECG. The appointment is not in the record.
    anchors:
