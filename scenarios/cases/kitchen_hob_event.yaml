schema: scenario_v4
id: kitchen_hob_event
split: held_out
title: Repeated kettle questions and a gas hob left on
summary: >
  Leonard makes his morning tea on a gas hob with written steps on the cupboard door, his
  long-standing routine; in April an occupational therapist saw one prompted tea-making task and
  advised an electric kettle, which he declined. Over several days he asks his daughter Fiona again and
  again whether he has boiled the kettle. On Friday morning Fiona finds a gas ring still lit with
  nothing on it; Leonard says he always turns it off. Nobody knows how long it was on, and Fiona
  later corrects her arrival time from about quarter past ten to nearer eleven. There is no carbon
  monoxide alarm that she knows of. Fiona takes the hob knobs off and buys an electric kettle with
  automatic shut-off, which Leonard uses. Leonard wants to keep making his own tea and heat soup.
  Fiona leaves a message at the surgery and fills in a fire service safety-check form, but no
  occupational therapy review, fire service visit, or alarm is arranged before the memory clinic.
start_date: "2026-07-06"
