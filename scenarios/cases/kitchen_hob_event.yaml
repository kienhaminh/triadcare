days:
  - day: 1
    patient:
      - ["Morning, Leonard. How are you?", "Not so bad. Knees are stiff."]
      - ["Had breakfast yet?", "Tea and a bit of toast. I make my own tea, always have."]
      - ["Do the notes on the cupboard help?", "Fiona put them up. I don't need them much, but they're there."]
    caregiver:
      - ["Hi Fiona. How's your dad?", "Much the same. He'd had his tea when I got there this morning. The hob was off."]
      - ["Did you see him make it?", "No, I never see him make it. I get there after he's had it."]
  - day: 2
    patient:
      - ["Hello Leonard. Sleep all right?", "All right. Up once for the toilet."]
      - ["Had a cup of tea this morning?", "I think so. Did I put the kettle on? I must have."]
      - ["Hearing aids in today?", "Not yet. They whistle at me."]
    caregiver:
      - ["Hi Fiona. How was he today?", "He asked me twice if he'd boiled the kettle. His cup was there on the table, half drunk."]
      - ["Is that new?", "He's always repeated himself a bit, but not about the kettle."]
  - day: 3
    patient:
      - ["Morning, Leonard. What are you up to?", "The racing on the radio. Had my tea."]
      - ["Anything bothering you?", "No. Bit tired."]
    caregiver:
      - ["Hi Fiona. Anything new?", "A quiet day. I only phoned tonight, I couldn't go round this morning."]
      - ["How did he sound?", "Fine. He said he'd had soup for lunch."]
  - day: 4
    patient:
      - ["Hello Leonard. How's your morning?", "Fine. I stood waiting for that kettle and never heard it go."]
      - ["Were your hearing aids in?", "No, they were on the side. I don't bother first thing."]
    caregiver:
      - ["Hi Fiona. How was he this morning?", "He asked me three times while I was there whether the kettle was on. It was cold, sitting on the back."]
      - ["Anything else worrying you?", "Only that. It's more than it was last month, I'd say. I'm not sure."]
  - day: 5
    patient:
      - ["Hello Leonard. Fiona tells me there was a problem with the cooker this morning. What do you remember?", "I turned it off. I always turn it off. She makes a fuss."]
      - ["Are you feeling all right? Any headache, dizziness or feeling sick?", "No. I'm fine. Nothing wrong with me."]
      - ["Did you hurt your hands at all?", "No."]
    caregiver:
      - ["Hi Fiona. How was your dad this morning?", "Not good. When I got there at about quarter past ten the front ring was lit on low with nothing on it. He was in the front room with the radio on."]
      - ["Do you know how long it had been on?", "No idea. He says he has his tea at eight, but his cup was cold. It could have been on since then, I just don't know."]
      - ["Is the hob off now, and is he hurt or unwell?", "I turned it off and opened the windows. No burns, no smoke, no smell of gas. He says he feels fine."]
      - ["Is there a carbon monoxide alarm in the flat?", "I don't think so. There's the smoke alarm in the hall, and that didn't go off."]
      - ["Please keep the room aired. No gas smell or alarm does not rule out carbon monoxide. Call 999 if there is a fire or he becomes very unwell, and the gas emergency line if you smell gas. Watch for headache, dizziness, sickness or new confusion. Can you contact his surgery today about this?", "Yes. I'll ring the surgery this afternoon. I'm staying with him till I go to work."]
  - day: 6
    patient:
      - ["Morning, Leonard. How are you?", "Fed up. Fiona's taken the knobs off my cooker."]
      - ["How did you make your tea?", "With that new plastic kettle she brought. It switches itself off."]
      - ["How do you feel about it?", "I'll use it if I must. I've been making tea on that hob for sixty years."]
    caregiver:
      - ["Hi Fiona. How are things after yesterday?", "I took the knobs off the hob last night and put them in my bag. I bought an electric kettle that switches itself off."]
      - ["How did he take it?", "Not well. He says I'm treating him like a child."]
  - day: 7
    patient:
      - ["Hello Leonard. Had your tea?", "Yes, with the electric one. It's quick, I'll give it that."]
      - ["Anything else?", "I want my knobs back."]
    caregiver:
      - ["Hi Fiona. How's the weekend been?", "I was there most of today. He used the new kettle on his own and it clicked off fine."]
      - ["Anything else?", "He went to put beans on at lunch and couldn't turn the hob on. He was cross, but I made them."]
  - day: 8
    patient:
      - ["Morning, Leonard. How are you?", "Fine. Had my tea."]
      - ["Hearing aids in?", "One of them. The other's playing up."]
    caregiver:
      - ["Hi Fiona. Any news from the surgery?", "I left a message with the surgery on Friday afternoon. Nobody has rung me back yet."]
      - ["Can we check the timing of Friday morning?", "I said quarter past ten last week, but it was nearer eleven. I stopped at the chemist first."]
      - ["Thanks. Anything else?", "No. I've kept the knobs off."]
  - day: 9
    patient:
      - ["Hello Leonard. How are you today?", "I want to do my own eggs. I'm not a child."]
      - ["What would you like to do in the kitchen?", "Make my tea how I like and heat a tin of soup at dinnertime. That's all I ask."]
    caregiver:
      - ["Hi Fiona. How's your dad?", "Grumpy about the cooker. Otherwise fine."]
      - ["Did the surgery call back?", "The receptionist rang this morning. She said the doctor will go through it at the memory clinic on Thursday. Nobody is coming out before then."]
      - ["Did you speak to a doctor or nurse?", "No, only the receptionist. Nobody has asked me how he is or checked him over."]
      - ["Has anything else been set up?", "I filled in the fire service form online for a home safety check. They haven't given me a date."]
  - day: 10
    patient:
      - ["Morning, Leonard. Anything you'd like the doctor to know?", "I want to keep making my own tea. I'll use the electric kettle if that's what it takes."]
      - ["And the hob?", "I'd like to heat my soup. I'm careful."]
    caregiver:
      - ["Hi Fiona. What would you like the doctor to know?", "Can he use the hob at all now? Should I get the gas capped off? I can't be there every lunchtime."]
      - ["What is in place at the moment?", "The knobs are off and he's using the electric kettle. I'll keep it like that until the doctor says."]
      - ["Has anything else been arranged, such as an occupational therapy visit or an alarm?", "No. Nobody has arranged an OT visit, the fire service haven't given a date, and I haven't got a carbon monoxide alarm yet."]
      - ["Anything else?", "Just that I worry about lunchtimes when I'm at work."]
