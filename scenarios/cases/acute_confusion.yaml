schema: scenario_v4
id: acute_confusion
split: dev
title: Acute change in confusion with an outside clinic visit
summary: >
  Over a few days Dorothy becomes much more muddled and sleepy, drinks little and goes to the toilet
  often. Her answers in check-ins become confused and less reliable, so her son Daniel becomes the main reporter. After he
  reports new confusion on Thursday, he is advised to call 999 or go to A&E immediately but delays because
  he is working and she gets upset when he mentions hospital. On Friday he finds her very drowsy and difficult to
  wake; he is advised to call emergency services and later reports an ambulance took her to hospital
  overnight. The next day she is easier to wake but remains below baseline. Daniel
  reports two missed bedtime tablets: she was too sleepy on Saturday, while the reason for Friday is unclear. He later decides to take her to
  a walk-in clinic on Sunday. A doctor there says a water infection is possible and gives an
  antibiotic that Daniel later reads as nitrofurantoin. A urine sample was sent off, but nobody has
  told him the result. Neither visit nor the antibiotic appears in the available record. She improves
  but is not back to her usual self by the end.
start_date: "2026-04-20"
patient:
  id: P-105
  name: Dorothy
  gender: female
  birth_year: 1944
  persona: Mild Alzheimer dementia. Lives with her son. Chatty and sociable, likes the radio and the crossword.
caregiver:
  name: Daniel
  relation: son
  persona: Lives with his mother. Works office hours on weekdays, so he sees her in the mornings and evenings only.
baseline:
  date: "2026-03-17"
  diagnosis: Dementia due to Alzheimer disease, mild stage
  mmse: 22
  moca: 16
  cdr_global: 1
  cdr_sb: 5.5
  faq: 12
record:
  - type: Condition
    id: condition-hypertension
    code: Essential hypertension
    status: active
    date: "2018-09-11"
  - type: MedicationRequest
    id: med-donepezil
    medication: Donepezil 10 mg tablet
    dosage: 10 mg by mouth once daily at bedtime
    status: active
    date: "2024-11-05"
  - type: MedicationRequest
    id: med-amlodipine
    medication: Amlodipine 5 mg tablet
    dosage: 5 mg by mouth once daily in the morning
    status: active
    date: "2019-02-20"
  - type: Encounter
    id: encounter-memory-review
    kind: Memory clinic follow-up
    status: finished
    date: "2026-03-17"
    reason: Routine review of mild Alzheimer dementia
  - type: DocumentReference
    id: note-memory-review
    title: Memory clinic follow-up note
    date: "2026-03-17"
    author: Memory clinic
    text: >-
      Stable since last review. MMSE 22 today. Lives with her son, who works weekdays. Independent
      with eating, washing and toileting; needs reminders for tablets and appointments. Eating and
      drinking well. Continue donepezil 10 mg at night. Review in six months.
imaging:
  - study_id: CASE-P105-MRI
    modality: mri
    date: "2025-09-03"
    description: Brain MRI without contrast for a dementia work-up
    source_series: DLBS-1023-W1-T1W
days:
  - day: 1
    patient:
      - ["Morning, Dorothy. How are things with you today?", "Lovely, thanks. I've just done my hair and the kettle's on."]
      - ["What have you got planned?", "Jean might pop round. She usually does on a Monday, or is it Tuesday? She'll come when she comes."]
      - ["How did you sleep?", "Like a log. I only got up the once, I think."]
    caregiver:
      - ["Hi Daniel. How was the weekend with your mum?", "Good, actually. We had my sister's lot round for lunch on Sunday and Mum was chatting away to the kids all afternoon."]
      - ["How is she managing during the week while you're at work?", "She's fine on her own. I leave a sandwich in the fridge and a jug of squash on the side and she gets on with it."]
      - ["Anything about her tablets?", "No. I give her the morning one before I go and the night one at bedtime, same as always."]
  - day: 2
    patient:
      - ["Hello Dorothy. Did Jean come round?", "She did, we had a good natter. She's got a new hip, you know. Or was it her knee."]
      - ["Have you eaten today?", "I had a boiled egg. Daniel says I should eat more but I'm never that hungry in the morning."]
      - ["Have you done any of the crossword?", "Half of it. The rest can wait, my brain's not awake yet."]
    caregiver:
      - ["Hi Daniel. How was your mum last night?", "Her usual self. She told me all about Jean's operation, twice, but that's normal for her."]
      - ["Did she eat the lunch you left?", "Yes, the plate was in the sink when I got home and the squash was mostly gone."]
  - day: 3
    patient:
      - ["Good morning, Dorothy. How are you feeling?", "Bit tired today, love. I kept getting up for the loo in the night."]
      - ["Do you often get up in the night?", "Not usually, no. Once maybe. I don't know what that was about."]
      - ["Anything hurting?", "No, nothing. Just a bit washed out."]
    caregiver:
      - ["Hi Daniel. How did your mum seem yesterday evening?", "Quieter than normal. She didn't want to watch her programme and she was in bed before nine."]
      - ["Did she say why?", "Just that she was tired. I didn't think much of it, everyone has an off day."]
      - ["How are you getting on?", "Fine. Work's busy, that's all."]
  - day: 4
    patient:
      - ["Hello Dorothy. How are you this morning?", "I'm waiting for Frank. He's gone up the road for the paper."]
      - ["Have you had a cup of tea yet?", "I don't want one. Frank will make one when he's back."]
      - ["How did you sleep last night?", "Is Daniel at school? I don't know where everyone is."]
    caregiver:
      - ["Hi Daniel. How was your mum last night?", "Not right at all. She was much more confused than usual and kept asking when Dad was coming home. He died six years ago."]
      - ["Has she done that before?", "Very occasionally, if she's really tired, and she drops it when I remind her. Last night she wouldn't let it go, she asked me over and over."]
      - ["Is she eating?", "Hardly. Her sandwich was still in the fridge when I got in and she pushed her tea round the plate."]
      - ["Is she awake and responding normally now? Has she had anything to drink?", "She's awake and answering me, but much more confused than usual. She has had only a little tea."]
      - ["A sudden change in confusion needs immediate assessment in A&E, even though she is answering. Call 999 now or take her to A&E immediately. Stay with her. What could make it hard to seek care?", "I'm uneasy. I'm out all day, and she gets upset when I mention hospital. I'll try to speak to someone after work."]
      - ["Please call 999 or take her to A&E now. We can stop this check-in while you get help."]
  - day: 5
    patient:
      - ["Good morning, Dorothy. How are you today?", "Is it the morning? It's very dark. I thought it was the evening."]
      - ["It's half past eight in the morning. Have you had breakfast?", "I'm so tired, love. I just want to lie down."]
    caregiver:
      - ["Yesterday I advised 999 or A&E immediately. Did you get emergency help? Tell me what happened and whether Dorothy is awake and answering normally right now.", "Worse. I came in from work and she was fast asleep in her chair, and from the cold tea next to her she'd been there since the afternoon. The jug of squash I left in the morning hadn't been touched. I got a glass of water into her before bed and that was it. She was going to the toilet constantly. She was up and down all evening, and I heard her up at least four times in the night. Her wee smells really strong, I could smell it in the bathroom. And there were wet knickers in the basket, which isn't like her. She had last night's tablets while half asleep. Now she opens her eyes briefly but doesn't answer properly. I didn't call after yesterday's advice. I thought I could wait, but now I'm frightened."]
      - ["Call 999 now because she is difficult to wake and not responding normally. Stay with her. Do not give food, drink or tablets while she is too sleepy to swallow safely. Can you call now?", "Yes. I'll call now and stay with her."]
      - ["Please make that call now. We can stop this check-in while you get urgent help."]
  - day: 6
    patient:
      - ["Hello Dorothy, it's the care team calling. How are you feeling?", "Who's that? Is that Frank?"]
      - ["It's the care team, Dorothy. Are you comfortable?", "I'll just close my eyes for a bit."]
    caregiver:
      - ["Hi Daniel. What happened after our call yesterday?", "I called 999. The ambulance crew took her to the emergency department on Friday night. They sent her home early this morning. I did not call for help on Thursday because I was working and hoped she would improve."]
      - ["How is she right now? Is she easy to wake, responding normally, and able to swallow?", "She's easier to wake than last night, but still confused and sleepy. She takes a few sips when awake. She missed Friday night's tablet before the ambulance took her. I don't have the discharge papers."]
      - ["Because she remains below her usual state and drinks very little, contact an urgent medical service again today. If she becomes difficult to wake or stops responding normally, call 999. Do not give oral medicine or drink unless she is alert enough to swallow. What might make follow-up difficult?", "Her surgery is shut until Monday, and I'm worried another hospital visit will upset her. I'll call 111 now and explain what has happened."]
      - ["Please make that call now. We can stop this check-in while you arrange urgent follow-up."]
  - day: 7
    patient:
      - ["Morning, Dorothy. How are you today?", "Leave me, love. I'm tired out."]
      - ["Would you like a drink of something?", "Not now. Later."]
    caregiver:
      - ["Hi Daniel. Were you able to reach 111 yesterday?", "I tried but did not get through. I found the discharge papers but could not find a clear follow-up plan. I decided to take her to the walk-in clinic this morning about the urine symptoms. We have not gone yet."]
      - ["Is she easy to wake and responding normally now? Is she swallowing safely?", "She's tired and confused, but easier to wake than yesterday. She can take a few sips when awake. She was too sleepy for her Saturday night tablet, so that is the second missed dose."]
      - ["Please seek urgent same-day medical advice because the confusion and poor intake continue after her emergency visit. If she becomes difficult to wake or stops responding normally, call 999. Do not give anything by mouth unless she is alert enough to swallow. Can you get urgent help today?", "Yes. I can take her to the walk-in clinic this morning. I'm still worried, but I won't wait until Monday."]
      - ["Please make that urgent contact now. We can stop this check-in while you take her for assessment."]
  - day: 8
    patient:
      - ["Hello Dorothy. How are you feeling today?", "A bit brighter, I think. My head feels like cotton wool."]
      - ["Did you go out to a clinic yesterday?", "I don't remember going out. I feel as if I've been here all week."]
      - ["Have you had something to drink?", "Daniel made me have some orange juice. And some tea."]
    caregiver:
      - ["Did you take Dorothy to the walk-in clinic yesterday?", "Yes. I decided to take her because I couldn't get clear follow-up advice from the hospital papers. The doctor said a water infection might be one cause and gave her antibiotics. I don't know whether the hospital sent them a note."]
      - ["Which antibiotic was it?", "I honestly can't remember the name. It's on the box at home and I'm at work."]
      - ["Did they do any tests?", "They had her do a urine sample and said they'd send it away. Nobody's rung me about it."]
      - ["How are you giving the new tablets?", "One with breakfast and one at teatime, I'm doing them myself."]
      - ["Did they give you anything to pass on to her own doctor?", "No letter. I don't know whether the hospital sent a note. I plan to tell her GP about both visits."]
  - day: 9
    patient:
      - ["Good morning, Dorothy. How are you today?", "Much more like myself, thanks. Daniel says I've had an infection."]
      - ["How are you sleeping?", "Too much, I think. Everything from the last week is a bit of a blur, to be honest."]
      - ["Have you eaten anything this morning?", "Some toast and marmalade. I fancied it, which is a good sign."]
    caregiver:
      - ["Hi Daniel. How is your mum doing on the antibiotics?", "Better. Last night she ate most of her dinner and we had a proper conversation about the news."]
      - ["Did you find the name of the antibiotic?", "Yes, I looked at the box. Nitrofurantoin, 100 milligram modified-release capsules, one twice a day for five days."]
      - ["How are her nights now?", "Up once for the toilet, not four or five times."]
      - ["Has she had her usual tablets?", "Yes, all of them since Sunday night, the night one as well."]
  - day: 10
    patient:
      - ["Hello Dorothy. How are you feeling today?", "Not too bad, love. Still a bit wobbly in my head."]
      - ["Have you been doing your crossword?", "I had a go but the words wouldn't come. I'll leave it for another day."]
      - ["Anything you'd like to tell the doctor?", "Only that I'd like to get back to normal. I miss going to the shops with Jean."]
    caregiver:
      - ["Hi Daniel. How has your mum been?", "Better than last week, but she's still not back to how she was before. By the evening she gets mixed up again, worse than she used to."]
      - ["What about during the day?", "My neighbour looked in at lunchtime and said Mum was asleep in the chair again. And this morning she asked me twice what day it was."]
      - ["Is she drinking better?", "Much better. She got through most of the jug yesterday, with me reminding her."]
      - ["Have you heard anything about the urine test?", "No, still nothing from the clinic."]
      - ["Is there anything you want the doctor to know?", "Does her own GP even know about the clinic and the antibiotics? Nobody gave me a letter, and I'm worried it'll happen again."]
units:
  - id: confusion-onset
    priority: essential
    must_state: ["a sudden, marked increase in confusion over her usual state"]
    content: Daniel reports that on the evening of 2026-04-22 his mother was much more confused than usual and asked over and over when her late husband was coming home; before, this happened only rarely and stopped when reminded. She had been quieter and tired the evening before, and in her own check-in she said she was waiting for Frank.
    anchors:
      - source: day-4:caregiver
        quote: She was much more confused than usual and kept asking when Dad was coming home. He died six years ago.
      - source: day-4:caregiver
        quote: Last night she wouldn't let it go, she asked me over and over.
      - source: day-3:caregiver
        quote: Quieter than normal. She didn't want to watch her programme and she was in bed before nine.
    reporter: caregiver
    event_time: Evening of 2026-04-22; quieter the evening before
    reported_at: "2026-04-23"
    uncertainty: Daniel sees her only in the evening on weekdays, so the exact start in the daytime is unknown.
  - id: poor-intake
    priority: essential
    must_state: ["she was hardly eating or drinking"]
    content: Daniel reports that his mother left her lunch, barely ate her evening meal, did not touch the drink he left, and after the emergency visit took only a few sips when awake.
    anchors:
      - source: day-4:caregiver
        quote: Her sandwich was still in the fridge when I got in and she pushed her tea round the plate.
      - source: day-5:caregiver
        quote: The jug of squash I left in the morning hadn't been touched.
      - source: day-6:caregiver
        quote: She takes a few sips when awake.
    reporter: caregiver
    event_time: 2026-04-22 to at least 2026-04-25
    reported_at: "2026-04-25"
    uncertainty: Daniel is at work on weekdays and judges intake from what is left over; nobody measured it.
  - id: urinary-symptoms
    priority: essential
    must_state: ["frequent toileting at night with strong-smelling urine and new wetting"]
    content: Daniel reports his mother going to the toilet constantly in the evening and at least four times a night, with strong-smelling urine and wet underwear, which is not like her. She herself said she kept getting up in the night, which is not usual for her.
    anchors:
      - source: day-5:caregiver
        quote: She was going to the toilet constantly. She was up and down all evening, and I heard her up at least four times in the night.
      - source: day-5:caregiver
        quote: Her wee smells really strong, I could smell it in the bathroom. And there were wet knickers in the basket, which isn't like her.
      - source: day-3:patient
        quote: Bit tired today, love. I kept getting up for the loo in the night.
    reporter: caregiver and patient
    event_time: Night of 2026-04-21 to night of 2026-04-23
    reported_at: "2026-04-24"
    uncertainty: Home observation only; no test result for the urine is known.
  - id: drowsy-disoriented
    priority: essential
    must_state: ["at worst she was very drowsy and hard to rouse"]
    content: Daniel found his mother asleep in her chair after work on 2026-04-23 and inferred from cold tea that she had been there since the afternoon. On 2026-04-24 Daniel reported that she opened her eyes briefly but did not answer properly. After her reported overnight emergency department visit, she was easier to wake but still confused and sleepy on 2026-04-25.
    anchors:
      - source: day-5:caregiver
        quote: I came in from work and she was fast asleep in her chair, and from the cold tea next to her she'd been there since the afternoon.
      - source: day-5:caregiver
        quote: Now she opens her eyes briefly but doesn't answer properly. I didn't call after yesterday's advice. I thought I could wait, but now I'm frightened.
      - source: day-6:caregiver
        quote: She's easier to wake than last night, but still confused and sleepy.
    reporter: caregiver
    event_time: Evening of 2026-04-23 to 2026-04-25
    reported_at: "2026-04-25"
    uncertainty: Daniel inferred from the cold tea that she had been asleep since the afternoon; he did not observe her during the workday. No alertness measurement or examination is available.
  - id: missed-donepezil
    priority: supporting
    must_state: ["two bedtime doses were missed, and her usual tablets have since resumed"]
    content: Daniel reports that his mother missed her bedtime tablet on Friday 2026-04-24 before the ambulance took her, and was too sleepy for it on Saturday 2026-04-25. She took all her usual tablets again from Sunday night.
    anchors:
      - source: day-6:caregiver
        quote: She missed Friday night's tablet before the ambulance took her.
      - source: day-7:caregiver
        quote: She was too sleepy for her Saturday night tablet, so that is the second missed dose.
      - source: day-9:caregiver
        quote: Yes, all of them since Sunday night, the night one as well.
    reporter: caregiver
    event_time: Nights of 2026-04-24 and 2026-04-25; restarted 2026-04-26
    reported_at: "2026-04-28"
    uncertainty: Daniel calls it the night tablet and does not name the drug; the reason for the Friday omission is unclear.
  - id: urgent-care-visit
    priority: essential
    must_state: ["the walk-in clinic visit is known only from Daniel, who has no clinic letter"]
    content: Daniel reports that after an emergency department visit overnight on 2026-04-24 to 2026-04-25, he decided to take Dorothy to a walk-in clinic on 2026-04-26. The walk-in doctor said a water infection was possible and gave antibiotics; Daniel has no clinic letter and does not know whether the hospital sent a note.
    anchors:
      - source: day-8:caregiver
        quote: Yes. I decided to take her because I couldn't get clear follow-up advice from the hospital papers. The doctor said a water infection might be one cause and gave her antibiotics. I don't know whether the hospital sent them a note.
      - source: day-8:caregiver
        quote: No letter. I don't know whether the hospital sent a note. I plan to tell her GP about both visits.
    reporter: caregiver
    event_time: "2026-04-26"
    reported_at: "2026-04-27"
    uncertainty: The emergency department and walk-in visits are known only from Daniel; neither has a note in her available record.
    essential_limit: true
  - id: delayed-emergency-help
    priority: essential
    must_state: ["Daniel delayed seeking emergency help after the earlier advice"]
    content: Daniel did not call for help after the care team advised 999 or A&E on Thursday 2026-04-23, because he was working and hoped she would improve. On 2026-04-25 he said her surgery is shut until Monday and he worries another hospital visit will upset her.
    anchors:
      - source: day-4:caregiver
        quote: I'm uneasy. I'm out all day, and she gets upset when I mention hospital. I'll try to speak to someone after work.
      - source: day-6:caregiver
        quote: I did not call for help on Thursday because I was working and hoped she would improve.
      - source: day-6:caregiver
        quote: Her surgery is shut until Monday, and I'm worried another hospital visit will upset her.
    reporter: caregiver
    event_time: 2026-04-23 to 2026-04-25
    reported_at: "2026-04-25"
    uncertainty: Daniel's own account of his reasons; his follow-through on later advice is known only from his reports.
  - id: emergency-assessment-reported
    priority: essential
    must_state: ["Daniel reports an emergency department visit overnight, with no details available"]
    content: After the care team advised emergency help when Dorothy was difficult to wake on 2026-04-24, Daniel later reported calling 999. He says an ambulance took her to the emergency department overnight and she went home early on 2026-04-25. On 2026-04-25 he said he did not have the discharge papers; no details of the assessment are available.
    anchors:
      - source: day-5:caregiver
        quote: Now she opens her eyes briefly but doesn't answer properly.
      - source: day-6:caregiver
        quote: I called 999. The ambulance crew took her to the emergency department on Friday night. They sent her home early this morning.
      - source: day-6:caregiver
        quote: I don't have the discharge papers.
    reporter: caregiver
    event_time: 2026-04-24 to 2026-04-25
    reported_at: "2026-04-25"
    uncertainty: Known only from Daniel; no emergency department record or assessment details are in the available sources.
    essential_limit: true
  - id: antibiotic-reported
    priority: essential
    must_state: ["a walk-in clinic gave an antibiotic, which Daniel identified as nitrofurantoin"]
    content: Daniel reports the walk-in clinic gave an antibiotic on 2026-04-26. By 2026-04-27 he reported giving the doses himself. He later read the box as nitrofurantoin 100 mg modified-release capsules, one twice a day for five days.
    anchors:
      - source: day-8:caregiver
        quote: Yes. I decided to take her because I couldn't get clear follow-up advice from the hospital papers. The doctor said a water infection might be one cause and gave her antibiotics. I don't know whether the hospital sent them a note.
      - source: day-9:caregiver
        quote: Nitrofurantoin, 100 milligram modified-release capsules, one twice a day for five days.
      - source: day-8:caregiver
        quote: One with breakfast and one at teatime, I'm doing them myself.
    reporter: caregiver
    event_time: Supplied 2026-04-26; administration reported by 2026-04-27
    reported_at: "2026-04-28"
    uncertainty: Daniel read the details from the box; no prescription record confirms them. The first dose date and course end date are unknown.
  - id: urine-test-unknown
    priority: essential
    must_state: ["the urine test result is not known"]
    content: The clinic took a urine sample and said it would be sent away; by 2026-04-29 nobody had told Daniel the result.
    anchors:
      - source: day-8:caregiver
        quote: They had her do a urine sample and said they'd send it away. Nobody's rung me about it.
      - source: day-10:caregiver
        quote: No, still nothing from the clinic.
    reporter: caregiver
    event_time: Sample taken 2026-04-26
    reported_at: "2026-04-29"
    uncertainty: The result is not in any available source.
    essential_limit: true
  - id: improving
    priority: supporting
    must_state: ["Daniel reports she is better"]
    content: Daniel reports Dorothy is better while receiving the antibiotic; she ate most of her dinner, talked properly, is up once a night instead of four or five times, and drank most of her jug with reminders.
    anchors:
      - source: day-9:caregiver
        quote: Last night she ate most of her dinner and we had a proper conversation about the news.
      - source: day-9:caregiver
        quote: Up once for the toilet, not four or five times.
      - source: day-10:caregiver
        quote: She got through most of the jug yesterday, with me reminding her.
    reporter: caregiver
    event_time: 2026-04-27 to 2026-04-28
    reported_at: "2026-04-29"
    uncertainty: Home observation only; no measurement.
  - id: not-back-to-baseline
    priority: essential
    must_state: ["she is better but not back to her usual self"]
    content: By 2026-04-29 Dorothy is not back to how she was before; she is more mixed up in the evenings than she used to be, was asleep in her chair at lunchtime, asked twice what day it was, and could not get going with her crossword.
    anchors:
      - source: day-10:caregiver
        quote: Better than last week, but she's still not back to how she was before. By the evening she gets mixed up again, worse than she used to.
      - source: day-10:caregiver
        quote: My neighbour looked in at lunchtime and said Mum was asleep in the chair again. And this morning she asked me twice what day it was.
      - source: day-10:patient
        quote: I had a go but the words wouldn't come.
    reporter: caregiver and patient
    event_time: 2026-04-28 to 2026-04-29
    reported_at: "2026-04-29"
    uncertainty: The daytime report comes second-hand from a neighbour; no cognitive test was repeated.
  - id: ehr-baseline
    priority: essential
    must_state: ["in March she was stable, with MMSE 22, and independent in self-care"]
    content: At the memory clinic review on 2026-03-17 Dorothy was stable with an MMSE of 22, independent with eating, washing and toileting, needing reminders for tablets, and eating and drinking well.
    anchors:
      - source: DocumentReference/note-memory-review
        quote: Stable since last review. MMSE 22 today.
      - source: DocumentReference/note-memory-review
        quote: Independent with eating, washing and toileting; needs reminders for tablets and appointments. Eating and drinking well.
    reporter: FHIR record
    event_time: "2026-03-17"
    reported_at: "2026-04-20"
    uncertainty: One clinic review six weeks before this period.
  - id: ehr-medications
    priority: essential
    must_state: ["nitrofurantoin is not on the record, which lists only donepezil and amlodipine"]
    content: The record lists donepezil 10 mg at bedtime and amlodipine 5 mg in the morning as the active medicines; it has no antibiotic.
    anchors:
      - source: MedicationRequest/med-donepezil
        quote: 10 mg by mouth once daily at bedtime
      - source: MedicationRequest/med-amlodipine
        quote: 5 mg by mouth once daily in the morning
    reporter: FHIR record
    event_time: Active at 2026-04-29
    reported_at: "2026-04-20"
    uncertainty: Prescribing record; it does not show which doses were taken or medicines from outside clinics.
  - id: no-renal-allergy-record
    priority: supporting
    must_state: ["the record has no kidney function or allergy information"]
    content: The available record has no kidney function result and no allergy record; its observations are cognitive scores only.
    anchors:
      - source: DocumentReference/note-memory-review
        quote: Continue donepezil 10 mg at night.
    reporter: FHIR record
    event_time: Record as of 2026-04-29
    reported_at: "2026-04-20"
    uncertainty: Absence from the available record does not show that no test or allergy exists elsewhere.
    essential_limit: true
  - id: ehr-last-encounter
    priority: supporting
    must_state: ["neither the walk-in clinic visit nor the emergency department visit is in the record"]
    content: The latest encounter in the record is a routine memory clinic follow-up on 2026-03-17; neither the walk-in clinic visit nor the emergency department visit that Daniel reports is in the record.
    anchors:
      - source: Encounter/encounter-memory-review
        quote: Routine review of mild Alzheimer dementia
      - source: day-6:caregiver
        quote: The ambulance crew took her to the emergency department on Friday night.
      - source: day-8:caregiver
        quote: Yes. I decided to take her because I couldn't get clear follow-up advice from the hospital papers. The doctor said a water infection might be one cause and gave her antibiotics. I don't know whether the hospital sent them a note.
    reporter: FHIR record and caregiver
